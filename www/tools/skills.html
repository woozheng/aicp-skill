<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill 管理 · AICP</title>
<meta name="page-title" content="技能管理">
<meta name="page-title-en" content="Skill Manager">
<meta name="page-icon" content="🧠">
<meta name="page-desc" content="上传与管理 SKILL 技能包">
<meta name="page-desc-en" content="Upload and manage SKILL skill packs">
<meta name="page-hide" content="1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background:#0a0a0f;
  color:#e5e7eb;
  font-family:'Inter','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  height:100%;
  overflow:hidden;
}
body { display:flex; flex-direction:column; height:100vh; }

/* ===== 标题栏 ===== */
.panel-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  background:rgba(15,15,22,0.8);
  backdrop-filter:blur(12px);
  flex-shrink:0;
}
.panel-title {
  font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px;
  letter-spacing:-0.01em;
}
.panel-title-icon {
  width:22px; height:22px; border-radius:6px; background:#6366f1;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:800; color:#fff;
}
.lang-toggle {
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  color:#9ca3af;
  padding:5px 10px; border-radius:6px;
  font-size:11px; font-family:'JetBrains Mono',monospace;
  cursor:pointer; transition:all 0.2s;
}
.lang-toggle:hover { color:#e5e7eb; border-color:rgba(255,255,255,0.2); }

/* ===== 内容区 ===== */
.content { flex:1; min-height:0; position:relative; }
.pane {
  position:absolute; inset:0; overflow-y:auto;
  padding:12px 14px 18px; display:none;
  -webkit-overflow-scrolling:touch;
}
.pane.active { display:block; }
* { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.16) transparent; }
*::-webkit-scrollbar { width:6px; height:6px; }
*::-webkit-scrollbar-track { background:transparent; }
*::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.14); border-radius:3px; }
*::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.26); }

/* ===== 底部标签 ===== */
.tab-bar {
  display:flex; gap:6px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,0.06);
  background:rgba(15,15,22,0.9);
  backdrop-filter:blur(12px);
  flex-shrink:0;
}
.tab-btn {
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 6px; border-radius:8px;
  border:1px solid transparent; background:transparent;
  color:#9ca3af; font-family:inherit; font-size:12.5px; font-weight:600;
  cursor:pointer; transition:all 0.2s;
}
.tab-btn.active {
  background:rgba(99,102,241,0.14);
  border-color:rgba(99,102,241,0.35);
  color:#c4b5fd;
}
.tab-btn svg {
  width:14px; height:14px; fill:none; stroke:currentColor;
  stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
}
.tab-btn .cnt {
  font-family:'JetBrains Mono',monospace; font-style:normal;
  font-size:10px; padding:1px 6px; border-radius:999px;
  background:rgba(255,255,255,0.07); color:#9ca3af;
}
.tab-btn.active .cnt { background:rgba(99,102,241,0.25); color:#c4b5fd; }

/* ===== 已加载列表 ===== */
.loaded-item {
  display:flex; align-items:center; gap:8px;
  padding:8px 10px; margin-bottom:6px;
  border:1px solid rgba(255,255,255,0.06);
  background:rgba(20,20,28,0.6);
  border-radius:9px;
  transition:border-color 0.2s;
}
.loaded-item:hover { border-color:rgba(99,102,241,0.25); }
.loaded-item .name {
  flex:1; min-width:0; cursor:pointer;
  font-size:13px; font-weight:600; color:#f3f4f6;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.loaded-item .name:hover { color:#c4b5fd; }

/* 圆型 - 按钮（卸载） */
.minus-btn {
  width:22px; height:22px; border-radius:50%;
  border:1px solid rgba(248,113,113,0.35);
  background:rgba(248,113,113,0.08);
  color:#f87171; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:15px; line-height:1; font-weight:600;
  flex-shrink:0; transition:all 0.2s;
}
.minus-btn:hover { background:rgba(248,113,113,0.22); color:#fca5a5; }

/* ===== 工具栏 ===== */
.toolbar { display:flex; gap:6px; margin-bottom:8px; align-items:center; }
.search {
  flex:1; min-width:0;
  padding:8px 11px; background:#0a0a0f;
  border:1px solid rgba(255,255,255,0.1); border-radius:7px;
  color:#e5e7eb; font-family:inherit; font-size:12.5px;
  outline:none; transition:border-color 0.2s;
}
.search:focus { border-color:rgba(99,102,241,0.55); }
/* 圆形图标按钮（刷新） */
.icon-btn {
  width:30px; height:30px; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid rgba(255,255,255,0.1); border-radius:7px;
  color:#9ca3af; cursor:pointer; padding:0;
  transition:all 0.2s;
}
.icon-btn svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.icon-btn:hover { color:#e5e7eb; border-color:rgba(255,255,255,0.22); }
.btn-primary {
  background:linear-gradient(135deg,#8b5cf6,#6366f1);
  color:#fff; border:none; border-radius:7px;
  padding:7px 11px; font-family:inherit; font-size:12px; font-weight:600;
  cursor:pointer; white-space:nowrap; transition:all 0.2s;
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  flex-shrink:0; box-shadow:0 3px 10px rgba(99,102,241,0.22);
}
.btn-primary:hover { filter:brightness(1.12); }
.btn-primary svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.btn-ghost {
  background:transparent; color:#9ca3af;
  border:1px solid rgba(255,255,255,0.1); border-radius:7px;
  padding:7px 14px; font-family:inherit; font-size:12.5px;
  cursor:pointer; transition:all 0.2s;
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
}
.btn-ghost svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.btn-ghost:hover { color:#e5e7eb; border-color:rgba(255,255,255,0.2); }
.btn-danger {
  background:#b91c1c; color:#fff; border:none; border-radius:7px;
  padding:7px 16px; font-family:inherit; font-size:12.5px; font-weight:600;
  cursor:pointer; transition:all 0.2s;
}
.btn-danger:hover { background:#dc2626; }

/* ===== 技能卡片 ===== */
.card-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:7px;
}
.skill-card {
  position:relative;
  background:rgba(20,20,28,0.6);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:9px;
  padding:8px 9px 8px;
  display:flex; flex-direction:column; gap:6px;
  transition:border-color 0.2s, background 0.2s;
  cursor:pointer;
}
.skill-card:hover {
  border-color:rgba(99,102,241,0.35);
  background:rgba(24,24,34,0.7);
}
.skill-card .cname {
  font-size:11.5px;
  font-weight:400;
  color:#e5e7eb;
  line-height:1.35;
  word-break:break-word;
  padding-right:22px; /* 给右上角删除按钮留位 */
}

/* 卡片右上角：悬停出现的删除 */
.card-del {
  position:absolute; top:6px; right:6px;
  width:20px; height:20px; border-radius:5px;
  border:1px solid rgba(248,113,113,0.25);
  background:rgba(248,113,113,0.08);
  color:#f87171; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none;
  transition:opacity 0.15s, background 0.15s;
  z-index:2;
}
.skill-card:hover .card-del { opacity:1; pointer-events:auto; }
.card-del:hover { background:rgba(248,113,113,0.24); color:#fca5a5; }
.card-del svg { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* 底部 meta 行：sid 小字 + 右侧 + 号 */
.cmeta {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  margin-top:auto;
}
.csid {
  flex:1; min-width:0;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:#6b7280;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.card-add {
  flex-shrink:0;
  width:20px; height:20px; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:50%;
  border:1px solid rgba(99,102,241,0.35);
  background:rgba(99,102,241,0.10);
  color:#a5b4fc;
  cursor:pointer;
  transition:all 0.2s;
  font-size:14px; font-weight:600; line-height:1;
}
.card-add:hover { background:rgba(99,102,241,0.22); color:#c4b5fd; }
.card-add.pinned {
  background:rgba(34,197,94,0.12);
  border-color:rgba(34,197,94,0.35);
  color:#4ade80;
  cursor:default;
}
.card-add.pinned:hover { background:rgba(34,197,94,0.12); color:#4ade80; }

/* ===== dir tip ===== */
.tip {
  display:flex; align-items:flex-start; gap:7px;
  padding:8px 9px; margin-bottom:8px;
  background:rgba(99,102,241,0.07);
  border:1px solid rgba(99,102,241,0.2);
  border-radius:8px; font-size:11px; color:#9ca3af; line-height:1.55;
}
.tip > svg { width:13px; height:13px; flex-shrink:0; margin-top:1px; fill:none; stroke:#a78bfa; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.tip code { font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#c4b5fd; background:rgba(255,255,255,0.06); padding:1px 5px; border-radius:4px; word-break:break-all; }
.tip-copy { margin-left:auto; background:transparent; border:none; color:#6b7280; cursor:pointer; padding:3px; border-radius:4px; flex-shrink:0; align-self:center; }
.tip-copy:hover { color:#e5e7eb; background:rgba(255,255,255,0.08); }
.tip-copy svg { width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* ===== file picker ===== */
.file-pick { display:flex; align-items:center; gap:8px; }
.file-pick .btn-ghost { padding:6px 11px; font-size:12px; }
.file-name { font-size:11px; color:#6b7280; font-family:'JetBrains Mono',monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.empty { padding:36px 12px; text-align:center; color:#6b7280; font-size:12.5px; }

/* ===== Modal ===== */
.modal {
  position:fixed; inset:0; background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center;
  z-index:1000; padding:18px;
}
.modal.show { display:flex; }
.modal-card {
  background:#14141c; border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; padding:20px; width:100%; max-width:400px;
  max-height:88vh; overflow-y:auto;
}
.modal-card.wide { max-width:720px; }
.modal-title { font-size:15px; font-weight:700; color:#f3f4f6; margin-bottom:8px; }
.modal-desc { font-size:12px; color:#9ca3af; margin-bottom:14px; line-height:1.5; word-break:break-all; }
.form-group { margin-bottom:11px; display:flex; flex-direction:column; gap:4px; }
.form-label {
  font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em;
  color:#6b7280; font-weight:600;
}
.form-input, .form-textarea {
  width:100%; padding:8px 11px; background:#0a0a0f;
  border:1px solid rgba(255,255,255,0.1); border-radius:7px;
  color:#e5e7eb; font-family:'JetBrains Mono',monospace; font-size:12px;
  outline:none; transition:border-color 0.2s;
}
.form-input:focus, .form-textarea:focus { border-color:rgba(99,102,241,0.55); }
.form-textarea { min-height:180px; resize:vertical; line-height:1.5; }
.form-hint { font-size:11px; color:#6b7280; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }

/* ===== Viewer（可编辑） ===== */
.viewer-wrap {
  display:flex; flex-direction:column; gap:8px;
}
.viewer-title-row {
  display:flex; align-items:center; gap:8px;
}
.viewer-title { font-size:14px; font-weight:700; color:#f3f4f6; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.viewer-badge {
  font-size:10px; font-family:'JetBrains Mono',monospace;
  padding:2px 7px; border-radius:999px;
  background:rgba(34,197,94,0.12); color:#4ade80;
  border:1px solid rgba(34,197,94,0.3);
  flex-shrink:0;
}
.viewer-editor {
  width:100%; min-height:46vh; max-height:58vh;
  padding:14px; background:#0a0a0f; border-radius:8px;
  border:1px solid rgba(255,255,255,0.08);
  font-family:'JetBrains Mono',monospace; font-size:11.5px; line-height:1.55;
  color:#e5e7eb; resize:vertical; outline:none;
  white-space:pre; overflow:auto;
}
.viewer-editor:focus { border-color:rgba(99,102,241,0.55); }
.viewer-edit-hint {
  font-size:11px; color:#6b7280; font-family:'JetBrains Mono',monospace;
}

.toast {
  position:fixed; left:50%; bottom:74px;
  transform:translateX(-50%) translateY(8px);
  background:#1c1c26; border:1px solid rgba(255,255,255,0.1);
  color:#e5e7eb; padding:8px 14px; border-radius:8px;
  font-size:12px; z-index:1200; opacity:0; pointer-events:none;
  transition:all 0.22s; max-width:86%;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.ok { border-color:rgba(34,197,94,0.45); }
.toast.err { border-color:rgba(248,113,113,0.45); }

@media (max-width:420px) {
  .card-grid { grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); }
  .toolbar { flex-wrap:wrap; }
}
</style>
</head>
<body>

<div class="panel-header">
  <div class="panel-title">
    <span class="panel-title-icon">S</span>
    <span data-i18n="sk.title">Skill 管理</span>
  </div>
  <button class="lang-toggle" id="langToggle">EN</button>
</div>

<div class="content">
  <section class="pane active" id="paneLoaded">
    <div id="loadedList"></div>
  </section>

  <section class="pane" id="paneManage">
    <div class="tip">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
      <span><span data-i18n="sk.dirTip">多文件技能请把整个目录拷贝到</span> <code id="skillsDir">E:\aicp-skills\data\skills\</code><br><span data-i18n="sk.dirTip2">上传仅支持单个 SKILL.md；多文件技能必须整目录拷贝。钉住总长度 ≤ 60KB</span></span>
      <button class="tip-copy" id="copyDirBtn" data-i18n-title="sk.copyPath" title="复制路径">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
    </div>
    <div class="toolbar">
      <input class="search" id="searchInput" type="search" data-i18n-ph="sk.search" placeholder="搜索技能…">
      <button class="icon-btn" id="refreshBtn" data-i18n-title="sk.refresh" title="刷新">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button class="btn-primary" id="uploadBtn" data-i18n-title="sk.upload" title="上传 Skill">
        <svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>
        <span data-i18n="sk.upload">上传 Skill</span>
      </button>
    </div>
    <div class="card-grid" id="skillGrid"></div>
  </section>
</div>

<nav class="tab-bar">
  <button class="tab-btn active" data-pane="loaded">
    <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
    <span data-i18n="sk.loaded">已加载</span>
    <em class="cnt" id="loadedCount">0</em>
  </button>
  <button class="tab-btn" data-pane="manage">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span data-i18n="sk.manage">技能管理</span>
  </button>
</nav>

<!-- 上传 Skill -->
<div class="modal" id="uploadModal">
  <div class="modal-card">
    <div class="modal-title" data-i18n="sk.uploadTitle">上传 Skill</div>
    <div class="modal-desc" id="uploadDesc"></div>
    <div class="form-group">
      <label class="form-label" data-i18n="sk.dirLabel">目录名</label>
      <input class="form-input" id="uploadName" data-i18n-ph="sk.dirPh" placeholder="stock-analyzer" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="sk.contentLabel">SKILL.md 内容</label>
      <textarea class="form-textarea" id="uploadContent"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label" data-i18n="sk.fileLabel">或选择本地文件</label>
      <div class="file-pick">
        <button type="button" class="btn-ghost" id="filePickBtn">
          <svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>
          <span data-i18n="sk.chooseFile">选择文件</span>
        </button>
        <span class="file-name" id="fileName">未选择文件</span>
        <input type="file" id="uploadFile" accept=".md,.markdown,.txt" hidden>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" data-close="uploadModal" data-i18n="sk.cancel">取消</button>
      <button class="btn-primary" id="uploadSubmit" data-i18n="sk.confirm">上传</button>
    </div>
  </div>
</div>

<!-- 删除确认 -->
<div class="modal" id="delModal">
  <div class="modal-card">
    <div class="modal-title" data-i18n="sk.delTitle">删除 Skill</div>
    <div class="modal-desc"><span id="delName"></span></div>
    <div class="modal-actions">
      <button class="btn-ghost" data-close="delModal" data-i18n="sk.cancel">取消</button>
      <button class="btn-danger" id="delOk" data-i18n="sk.delOk">删除</button>
    </div>
  </div>
</div>

<!-- 查看 / 编辑内容 -->
<div class="modal" id="viewerModal">
  <div class="modal-card wide">
    <div class="viewer-wrap">
      <div class="viewer-title-row">
        <div class="viewer-title" id="viewerTitle"></div>
        <span class="viewer-badge" id="viewerBadge" style="display:none" data-i18n="sk.pinnedBadge">已钉住</span>
      </div>
      <div class="viewer-edit-hint" id="viewerHint"></div>
      <textarea class="viewer-editor" id="viewerBody" spellcheck="false"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="viewerCopy" data-i18n="sk.copy">复制</button>
      <button class="btn-primary" id="viewerSave" data-i18n="sk.save">保存</button>
      <button class="btn-ghost" data-close="viewerModal" data-i18n="sk.close">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = {
  file: '/api/builtins/tools/file_utils_api',
  skillLoader: '/api/builtins/tools/skill_loader',
};

const SESSION_ID = new URLSearchParams(location.search).get('session_id') || '';

/* 后端钉住总长度上限（与 skill_loader.MAX_PINNED_TOTAL_BYTES 对齐） */
const MAX_PINNED_TOTAL = 60 * 1024;

const I18N = {
  zh: {
    'sk.title':'Skill 管理',
    'sk.loaded':'已加载',
    'sk.manage':'技能管理',
    'sk.search':'搜索技能…（可搜名字、描述、路径、sid）',

const ICON = {
  del: '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>'
};

let LANG = 'zh';
try { LANG = localStorage.getItem('aicp_lang') || localStorage.getItem('aicp_skills_lang') || 'zh'; } catch (e) { LANG = 'zh'; }

const STATE = {
  skills: [],
  pinned: {},
  query: '',
  pane: 'loaded',
  loading: true,
  viewerSkill: null,
  viewerOriginal: '',
};

function t(k) { return (I18N[LANG] && I18N[LANG][k]) || k; }

function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function toast(msg, kind) {
  kind = kind || 'ok';
  const el = document.getElementById('toast');
  el.innerHTML = msg;
  el.className = 'toast show ' + kind;
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className = 'toast'; }, 2600);
}

async function postJSON(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  let data;
  try { data = await res.json(); } catch (e) { data = { ok: false, error: 'invalid json' }; }
  return data;
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

/* ---------- 渲染 ---------- */
function renderLoaded() {
  const box = document.getElementById('loadedList');
  const cnt = document.getElementById('loadedCount');
  const items = STATE.skills.filter(function(s){ return s._p; });
  if (cnt) cnt.textContent = items.length;
  if (STATE.loading) {
    box.innerHTML = '<div class="empty">' + esc(t('sk.loading')) + '</div>';
    return;
  }
  if (!items.length) {
    box.innerHTML = '<div class="empty">' + esc(t('sk.emptyLoaded')) + '</div>';
    return;
  }
  box.innerHTML = items.map(function(s){
    const name = s.title || s.skill_id;
    return '<div class="loaded-item" data-sid="' + esc(s.skill_id) + '">'
      + '<span class="name" data-act="view" title="' + esc(name) + '">' + esc(name) + '</span>'
      + '<button class="minus-btn" data-act="unpin" title="' + esc(t('sk.unpin')) + '">−</button>'
      + '</div>';
  }).join('');
}

function renderManage() {
  const box = document.getElementById('skillGrid');
  const q = STATE.query.trim().toLowerCase();
  const items = STATE.skills.filter(function(s){
    if (!q) return true;
    const hay = (
      (s.skill_id || '') + ' ' +
      (s.title || '') + ' ' +
      (s.description || '') + ' ' +
      (s.file_path || '') + ' ' +
      (s.skill_dir || '')
    ).toLowerCase();
    return hay.indexOf(q) >= 0;
  });
  if (STATE.loading) {
    box.innerHTML = '<div class="empty">' + esc(t('sk.loading')) + '</div>';
    return;
  }
  if (!items.length) {
    box.innerHTML = '<div class="empty">' + esc(t('sk.emptyManage')) + '</div>';
    return;
  }
  box.innerHTML = items.map(function(s){
    const name = s.title || s.skill_id;
    const pinned = !!s._p;
    const addCls = pinned ? 'card-add pinned' : 'card-add';
    const addTitle = pinned ? t('sk.pinnedBadge') : t('sk.pin');
    const addChar = pinned ? '✓' : '+';
    return '<div class="skill-card" data-sid="' + esc(s.skill_id) + '" data-act="view">'
      + '<button class="card-del" data-act="delete" title="' + esc(t('sk.delete')) + '">' + ICON.del + '</button>'
      + '<div class="cname" title="' + esc(name) + '">' + esc(name) + '</div>'
      + '<div class="cmeta">'
      +   '<span class="csid" title="' + esc(s.skill_id) + '">' + esc(s.skill_id) + '</span>'
      +   '<button class="' + addCls + '" data-act="' + (pinned ? 'noop' : 'pin') + '" title="' + esc(addTitle) + '">' + addChar + '</button>'
      + '</div>'
      + '</div>';
  }).join('');
}

function render() { renderLoaded(); renderManage(); }

/* ---------- 数据 ---------- */
async function loadSkills() {
  STATE.loading = true;
  render();
  try {
    const listRes = await postJSON(API.skillLoader, { action: 'list', limit: 500, session_id: SESSION_ID });
    const all = (listRes && listRes.data && listRes.data.skills) || [];

    const idxRes = await postJSON(API.skillLoader, { action: 'index', session_id: SESSION_ID });
    const raw = (idxRes && idxRes.skills) || (idxRes && idxRes.data && idxRes.data.skills) || [];

    const pinnedMap = {};
    const pinnedList = [];
    raw.forEach(function(p){
      const sid = (typeof p === 'string') ? p : (p.skill_id || '');
      if (!sid) return;
      const st = (typeof p === 'string') ? 'pinned' : (p.status || 'indexed');
      if (st !== 'pinned') return;
      const title = (typeof p === 'string') ? p : (p.title || p.skill_id || sid);
      const fp = (typeof p === 'string') ? '' : (p.path || p.file_path || '');
      pinnedMap[sid] = { skill_id: sid, title: title, file_path: fp };
      pinnedList.push(sid);
    });
    STATE.pinned = pinnedMap;

    const merged = all.map(function(s){
      const sid = s.skill_id || '';
      const p = pinnedMap[sid];
      return {
        skill_id: sid,
        title: s.title || sid,
        description: s.description || '',
        file_path: s.file_path || '',
        status: p ? 'pinned' : 'indexed',
        _p: !!p,
      };
    });
    const known = {};
    merged.forEach(function(s){ known[s.skill_id] = true; });
    pinnedList.forEach(function(sid){
      if (known[sid]) return;
      merged.push({
        skill_id: sid,
        title: pinnedMap[sid].title || sid,
        description: '',
        file_path: pinnedMap[sid].file_path || '',
        status: 'pinned',
        _p: true,
      });
    });
    STATE.skills = merged;
  } catch (e) {
    console.error(e);
    STATE.skills = [];
    toast(t('sk.fail') + ': ' + e.message, 'err');
  } finally {
    STATE.loading = false;
    render();
  }
}

/* ---------- 路径规范化 ---------- */
function skillFilePath(s) {
  let fp = (s && s.file_path) ? String(s.file_path) : '';
  if (!fp) return '';
  fp = fp.replace(/\\/g, '/');
  if (fp.indexOf('data/') === 0) return fp;
  return 'data/skills/' + fp;
}

/* ---------- 操作 ---------- */
async function doPin(sid) {
  const res = await postJSON(API.skillLoader, { action: 'pin', skill_id: sid, session_id: SESSION_ID });
  if (res && res.ok) {
    toast(t('sk.okLoad') + ': ' + (res.title || sid));
    await loadSkills();
    notifyParentSkillChanged();
  } else {
    if (res && res.pinned_total !== undefined && res.new_size !== undefined) {
      const used = fmtBytes(res.pinned_total);
      const add = fmtBytes(res.new_size);
      const limit = fmtBytes(res.limit || MAX_PINNED_TOTAL);
      const msg = t('sk.limitTitle') + ' — ' + t('sk.limitBody')
        .replace('{used}', used).replace('{add}', add).replace('{limit}', limit);
      toast(msg, 'err');
    } else {
      toast(t('sk.fail') + ': ' + ((res && res.error) || ''), 'err');
    }
  }
}

async function doUnpin(sid) {
  const res = await postJSON(API.skillLoader, { action: 'unpin', skill_id: sid, session_id: SESSION_ID });
  if (res && res.ok) {
    toast(t('sk.okUnload') + ': ' + (res.title || sid));
    await loadSkills();
    notifyParentSkillChanged();
    if (STATE.viewerSkill && STATE.viewerSkill.skill_id === sid) {
      STATE.viewerSkill._p = false;
      updateViewerBadge();
    }
  } else {
    toast(t('sk.fail') + ': ' + ((res && res.error) || ''), 'err');
  }
}

async function doView(sid) {
  const s = STATE.skills.find(function(x){ return x.skill_id === sid; });
  if (!s) return;
  const path = skillFilePath(s);
  if (!path) {
    toast(t('sk.fail') + ': ' + t('sk.noPath'), 'err');
    return;
  }
  const res = await postJSON(API.file, { action: 'read_file', path: path });
  if (!res || !res.ok) {
    toast(t('sk.fail') + ': ' + ((res && res.error) || ''), 'err');
    return;
  }
  const data = res.data || {};
  let text = '';
  if (data.truncated) {
    const total = data.total_lines || 0;
    const linesRes = await postJSON(API.file, {
      action: 'read_file_lines', path: path, start_line: 1, end_line: total || 100000
    });
    if (linesRes && linesRes.ok) {
      const lines = (linesRes.data && linesRes.data.lines) || [];
      text = lines.map(function(l){ return typeof l === 'string' ? l : (l.content || ''); }).join('\n');
    } else {
      text = data.preview || '';
    }
  } else {
    text = data.full_content || '';
  }

  STATE.viewerSkill = s;
  STATE.viewerOriginal = text;
  document.getElementById('viewerTitle').textContent = s.title || sid;
  document.getElementById('viewerBody').value = text;
  document.getElementById('viewerHint').textContent = t('sk.editHint');
  updateViewerBadge();
  openModal('viewerModal');
}

function updateViewerBadge() {
  const badge = document.getElementById('viewerBadge');
  const pinned = STATE.viewerSkill && STATE.viewerSkill._p;
  badge.style.display = pinned ? '' : 'none';
}

async function doSaveViewer() {
  const s = STATE.viewerSkill;
  if (!s) return;
  const path = skillFilePath(s);
  if (!path) {
    toast(t('sk.fail') + ': ' + t('sk.noPath'), 'err');
    return;
  }
  const content = document.getElementById('viewerBody').value;
  if (content === STATE.viewerOriginal) {
    closeModal('viewerModal');
    return;
  }

  const res = await postJSON(API.file, { action: 'write_file', path: path, content: content });
  if (!res || !res.ok) {
    toast(t('sk.fail') + ': ' + ((res && res.error) || ''), 'err');
    return;
  }
  STATE.viewerOriginal = content;

  if (s._p) {
    const pinRes = await postJSON(API.skillLoader, {
      action: 'pin', skill_id: s.skill_id, session_id: SESSION_ID
    });
    if (pinRes && pinRes.ok) {
      toast(t('sk.okSave') + ' · ' + t('sk.okSync'), 'ok');
    } else if (pinRes && pinRes.pinned_total !== undefined && pinRes.new_size !== undefined) {
      const used = fmtBytes(pinRes.pinned_total);
      const add = fmtBytes(pinRes.new_size);
      const limit = fmtBytes(pinRes.limit || MAX_PINNED_TOTAL);
      const msg = t('sk.limitTitle') + ' — ' + t('sk.limitBody')
        .replace('{used}', used).replace('{add}', add).replace('{limit}', limit)
        + ' ' + t('sk.okSave');
      toast(msg, 'err');
    } else {
      toast(t('sk.okSave') + ' · ' + t('sk.fail') + ': ' + ((pinRes && pinRes.error) || ''), 'err');
    }
  } else {
    toast(t('sk.okSave'), 'ok');
  }

  closeModal('viewerModal');
  await loadSkills();
}

async function doDelete(sid) {
  const s = STATE.skills.find(function(x){ return x.skill_id === sid; });
  if (s && s._p) {
    await postJSON(API.skillLoader, { action: 'unpin', skill_id: sid, session_id: SESSION_ID });
  }
  document.getElementById('delName').textContent = (s && (s.title || sid)) || sid;
  openModal('delModal');
  document.getElementById('delOk').onclick = async function(){
    closeModal('delModal');
    await postJSON(API.skillLoader, { action: 'unpin', skill_id: sid, session_id: SESSION_ID });
    const cands = [];
    const fp = skillFilePath(s || {});
    if (fp) cands.push(fp);
    cands.push('data/skills/' + sid + '/SKILL.md');
    let done = false;
    for (const p of cands) {
      const r = await postJSON(API.file, { action: 'delete_file', path: p });
      if (r && r.ok) { done = true; break; }
    }
    if (done) {
      toast(t('sk.okDel') + ': ' + sid);
      await loadSkills();
    } else {
      toast(t('sk.fail'), 'err');
    }
  };
}

async function doUpload() {
  const name = document.getElementById('uploadName').value.trim();
  const content = document.getElementById('uploadContent').value.trim();
  if (!name) { toast(t('sk.needName'), 'err'); return; }
  if (!/^[a-zA-Z0-9_\-]+$/.test(name)) { toast(t('sk.badName'), 'err'); return; }
  if (!content) { toast(t('sk.needContent'), 'err'); return; }
  const path = 'data/skills/' + name + '/SKILL.md';
  const res = await postJSON(API.file, { action: 'write_file', path: path, content: content });
  if (!res || !res.ok) {
    toast(t('sk.fail') + ': ' + ((res && res.error) || ''), 'err');
    return;
  }
  closeModal('uploadModal');
  document.getElementById('uploadName').value = '';
  document.getElementById('uploadContent').value = '';
  document.getElementById('uploadFile').value = '';
  const fn = document.getElementById('fileName');
  if (fn) { fn.textContent = t('sk.noFile'); delete fn.dataset.picked; }
  toast(t('sk.okUpload') + ': ' + name);
  await loadSkills();
}

/* ---------- 标签切换 ---------- */
function switchPane(name) {
  STATE.pane = name;
  const map = { loaded: 'paneLoaded', manage: 'paneManage' };
  document.querySelectorAll('.pane').forEach(function(p){
    p.classList.toggle('active', p.id === map[name]);
  });
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-pane') === name);
  });
}

/* ---------- i18n ---------- */
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    const key = el.getAttribute('data-i18n');
    const v = t(key);
    if (v && v !== key) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
    el.placeholder = t(el.getAttribute('data-i18n-ph'));
  });
  const ud = document.getElementById('uploadDesc');
  if (ud) ud.textContent = t('sk.uploadDesc');
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){
    el.title = t(el.getAttribute('data-i18n-title'));
  });
  const fn = document.getElementById('fileName');
  if (fn && !fn.dataset.picked) fn.textContent = t('sk.noFile');
  document.getElementById('langToggle').textContent = LANG === 'zh' ? 'EN' : '中';
  const hint = document.getElementById('viewerHint');
  if (hint) hint.textContent = t('sk.editHint');
  render();
}

function toggleLang() {
  LANG = LANG === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('aicp_skills_lang', LANG); } catch (e) {}
  try { localStorage.setItem('aicp_lang', LANG); } catch (e) {}
  applyI18n();
  notifyParentLang(LANG);
}

function notifyParentLang(lang) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'aicp_lang', lang: lang }, '*');
    }
  } catch (e) {}
}

function notifyParentSkillChanged() {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'aicp_skill_pinned' }, '*');
    }
  } catch (e) {}
}

window.addEventListener('message', function(e){
  if (!e.data || e.data.type !== 'aicp_lang') return;
  var lang = e.data.lang;
  if (lang !== 'zh' && lang !== 'en') return;
  if (lang === LANG) return;
  LANG = lang;
  try { localStorage.setItem('aicp_lang', lang); } catch (e) {}
  applyI18n();
});

window.addEventListener('storage', function(e){
  if (!e.key || e.key !== 'aicp_lang') return;
  var lang = e.newValue;
  if (lang !== 'zh' && lang !== 'en') return;
  if (lang === LANG) return;
  LANG = lang;
  applyI18n();
});

  const fn = document.getElementById('fileName');

  fn.dataset.picked = '1';

    document.getElementById('uploadContent').value = ev.target.result;

      document.getElementById('uploadName').value = f.name
        .replace(/\.(md|markdown|txt)$/i, '')

document.getElementById('viewerSave').addEventListener('click', doSaveViewer);

document.addEventListener('click', function(e){
  const btn = e.target.closest ? e.target.closest('[data-act]') : null;
  if (btn) {
    const holder = btn.closest('[data-sid]');
    const sid = holder ? holder.getAttribute('data-sid') : '';
    const act = btn.getAttribute('data-act');

    if (act === 'noop') {
      e.stopPropagation();
      return;
    }
    if (act === 'delete') {
      e.stopPropagation();
      doDelete(sid);
      return;
    }
    if (act === 'pin') {
      e.stopPropagation();
      doPin(sid);
      return;
    }
    if (act === 'unpin') {
      e.stopPropagation();
      doUnpin(sid);
      return;
    }
    if (act === 'view') {
      doView(sid);
      return;
    }
    return;
  }
  const close = e.target.closest ? e.target.closest('[data-close]') : null;
  if (close) closeModal(close.getAttribute('data-close'));
});

document.querySelectorAll('.modal').forEach(function(m){
  m.addEventListener('click', function(e){ if (e.target === m) m.classList.remove('show'); });
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') document.querySelectorAll('.modal.show').forEach(function(m){ m.classList.remove('show'); });
});

/* ---------- 启动 ---------- */
applyI18n();
loadSkills();
</script>
</body>
</html>
