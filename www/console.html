// ============ WebSocket ============
var ws = null;
var wsHeartbeat = null;
var reconnectDelay = 3000;
var _wsChannel = null;
var _wsConnecting = false;
var _wsEverConnected = false;
var _needResync = false;   // 断线重连后需要补拉断线期间的消息   // 是否成功连上过（用于判断重连后补拉）

// WebSocket 状态灯：只保留信号点，状态文字改为 title 悬浮提示
function setWsStatus(connected) {
    var el = document.getElementById('wsStatus');
    if (!el) return;
    el.innerHTML = '<span class="dot ' + (connected ? 'green' : 'red') + '"></span>';
    el.title = connected ? t('footer.ws') : (_lang === 'zh' ? '已断开' : 'Disconnected');
}
function connectWS() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    if (_wsConnecting) return;
    _wsConnecting = true;
    var channel = 'pa_' + _userId;
    fetch('/api/ws_config').then(function(r){ return r.json(); }).then(function(cfg){
        var url = cfg.url || ('ws://' + location.hostname + ':' + (parseInt(location.port||9000)+1) + '/ws');
        if (cfg.url && !/:\d+/.test(cfg.url.replace('ws://','').replace('wss://','').split('/')[0])) {
            var port = cfg.port || (parseInt(location.port||9000)+1);
            url = cfg.url.replace(/\/ws$/, ':' + port + '/ws');
        }
        var token = getToken();
        var full = url + '?channel=' + encodeURIComponent(channel);
        if (token) full += '&token=' + encodeURIComponent(token);
        ws = new WebSocket(full);
        ws.onopen = function() {
            _wsConnecting = false;
            reconnectDelay = 3000;
            setWsStatus(true);
            if (wsHeartbeat) clearInterval(wsHeartbeat);
            wsHeartbeat = setInterval(function(){ if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'ping'})); }, 15000);
            _wsEverConnected = true;
            if (_needResync) { _needResync = false; resyncCurrentConversation(); }
        };
        ws.onmessage = function(e) {
            try {
                var msg = JSON.parse(e.data);
                if (msg.type === 'pong') return;
                handleWsData(msg.data || msg);
            } catch(err) { console.warn('WS parse:', err); }
        };
        ws.onclose = function(e) {
            _wsConnecting = false;
            setWsStatus(false);
            if (wsHeartbeat) { clearInterval(wsHeartbeat); wsHeartbeat = null; }
            // 服务端心跳超时也用 1000 关闭，之前按 code!==1000 判断导致断线后永不重连
            if (_wsEverConnected) _needResync = true;
            setTimeout(function(){ connectWS(); }, reconnectDelay);
            if (reconnectDelay < 30000) reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
        };
        ws.onerror = function(){};
    }).catch(function(){
        _wsConnecting = false;
        setTimeout(function(){ connectWS(); }, reconnectDelay);
    });
}

function handleWsData(data) {
    var sid = data.session_id || '';
    var isSub = sid.startsWith('sub_');
    if (isSub) {
        if (!subSessions[sid]) {
            subSessions[sid] = {
                id: sid,
                title: data.description || ('Sub: ' + sid.slice(0, 12)),
                status: 'running',
                updated_at: new Date().toISOString(),
                is_sub: true,
                parent_session: data.parent_session || currentConversationId || '',
            };
            mergeSubSessionsIntoConversations();
            renderConversationList(conversations);
        }
        if (data.type === 'progress' && data.status === 'reply') {
            subSessions[sid].status = 'done';
            subSessions[sid].updated_at = new Date().toISOString();
            mergeSubSessionsIntoConversations();
            renderConversationList(conversations);
        }
        if (data.type === 'progress' && data.status === 'interrupted') {
            subSessions[sid].status = 'failed';
            subSessions[sid].updated_at = new Date().toISOString();
            mergeSubSessionsIntoConversations();
            renderConversationList(conversations);
        }
        if (data.type === 'chat') {
            subSessions[sid].last_preview = (data.content || '').slice(0, 80);
            subSessions[sid].updated_at = new Date().toISOString();
        }
        if (!subSessionBuffers[sid]) subSessionBuffers[sid] = [];
        subSessionBuffers[sid].push(data);
        if (sid === currentConversationId) handleSubEvent(data);
        return;
    }
    // 分身创建/删除/清理必须有全局信号：不受「非当前会话就丢弃」限制
    if (data.type === 'progress' && data.step === 'subtasks_changed') {
        _convListCache.ts = 0;
        if (typeof reloadSubTasks === 'function') { try { reloadSubTasks(); } catch (e) {} }
        refreshConversations(true).then(function(){ renderConversationList(conversations); }).catch(function(){});
        return;
    }
    if (sid && sid !== currentConversationId) return;
    var type = data.type || '';
    if (type === 'chat') {
        if (data.content) { removeThinkingLine(); addAssistantMessage(data.content); }
        return;
    }
    if (type === 'progress') {
        var step = data.step || '';
        var status = data.status || '';
        if (step === 'thinking') { ensureThinkingLine(); return; }
        if (step === 'subtasks_changed') {
            _convListCache.ts = 0;
            loadConversations();
            return;
        }
        if (step === 'analyzed') {
            var line2 = ensureThinkingLine();
            if (line2) line2.textContent = '💭 ' + (data.msg || '🔍 分析完成');
            return;
        }
        if (status === 'start') { handleToolStart(data); return; }
        if (status === 'ok' || status === 'error') { handleToolEnd(data); return; }
        if (status === 'reply' && data.is_final) { handleReplyEnd(data); return; }
        if (status === 'interrupting') { handleInterrupting(); return; }
        if (status === 'interrupted') { handleInterrupted(); return; }
        if (status === 'retrying') {
            var line = ensureThinkingLine();
            if (line) line.textContent = '💭 ' + (data.msg || 'try to connect...');
            return;
        }
        return;
    }
    if (type === 'summary_stream') { updateThinkingLine(data.chunk || ''); return; }
    if (type === 'stats') { updateStatsBar(data.stats || {}); return; }
    if (type === 'error') { removeThinkingLine(); addAssistantMessage('❌ ' + (data.error || data.message || '')); refreshActivity(); return; }
}
function mergeSubSessionsIntoConversations() {
    // 记住服务端返回的「分身 → 父会话」关系（live 分身状态优先）
    var parentMap = {};
    var serverSubIds = {};
    conversations.forEach(function(c){
        if (c && c.id && c.id.indexOf('sub_') === 0) {
            serverSubIds[c.id] = 1;
            if (c.parent_session) parentMap[c.id] = c.parent_session;
        }
    });
    // 服务端已不存在的分身（被主控删除/清理），一律从本地缓存剔除
    // 服务端返回的会话列表是唯一权威：不再为本地 running 状态开例外
    Object.keys(subSessions).forEach(function(sid){
        if (!serverSubIds[sid]) {
            delete subSessions[sid];
            delete subSessionBuffers[sid];
            if (_selectedSubTask === sid) _selectedSubTask = null;
        }
    });
    conversations = conversations.filter(function(c){ return !c.id.startsWith('sub_'); });
    Object.keys(subSessions).forEach(function(sid){
        var live = subSessions[sid];
        if (!live.parent_session && parentMap[sid]) live.parent_session = parentMap[sid];
        conversations.push(live);
    });
    conversations = orderConversations(conversations);
}
function handleSubEvent(data) {
    var type = data.type || '';
    var step = data.step || '';
    var status = data.status || '';
    if (type === 'chat') {
        if (data.content) { removeThinkingLine(); addAssistantMessage(data.content); }
        return;
    }
    if (type === 'progress') {
        if (step === 'thinking') { ensureThinkingLine(); return; }
        if (status === 'start') { handleToolStart(data); return; }
        if (status === 'ok' || status === 'error') { handleToolEnd(data); return; }
        if (status === 'reply' && data.is_final) { handleReplyEnd(data); return; }
        if (status === 'interrupting') { handleInterrupting(); return; }
        if (status === 'interrupted') { handleInterrupted(); return; }
        if (status === 'retrying') {
            var line = ensureThinkingLine();
            if (line) line.textContent = '💭 ' + (data.msg || '正在重试...');
            return;
        }
        return;
    }
    if (type === 'summary_stream') { updateThinkingLine(data.chunk || ''); return; }
    if (type === 'stats') { updateStatsBar(data.stats || {}); return; }
    if (type === 'error') { removeThinkingLine(); addAssistantMessage('❌ ' + (data.error || data.message || '')); return; }
}
function updateStatsBar(stats) {
    var box = document.getElementById('statsInline');
    if (!box) return;
    function fmt(n){ n=n||0; if(n>=1000) return (n/1000).toFixed(1)+'K'; return String(n); }
    document.getElementById('statCtx').textContent = (stats.context_k||0) + 'K';
    var ch = document.getElementById('statCacheHit');
    if (ch) ch.textContent = (stats.cache_hit_pct != null ? Number(stats.cache_hit_pct).toFixed(1) : '0') + '%';
    document.getElementById('statRound').textContent = fmt(stats.round_total);
    document.getElementById('statDepth').textContent = (stats.depth||0) + '/' + (stats.max_depth||40);
    box.style.display = 'inline';
}

var _cmdNames = null;      // 插件名全量缓存
var _cmdDescs = {};        // 插件名 → 描述（后端 descriptions）
var _cmdPromise = null;    // in-flight 请求
var _cmdItems = [];        // 当前候选
var _cmdIdx = 0;           // 选中下标

var _cmdTTL = 30000;       // 缓存有效期 30s

function loadCmdNames() {
    if (_cmdNames && (Date.now() - _cmdTs < _cmdTTL)) return Promise.resolve(_cmdNames);
    if (_cmdPromise) return _cmdPromise;
    _cmdNames = null;
    _cmdPromise = apiFetch('/api/builtins/tools/cogitor', {action:'list_all', exclude_prefix:['builtins/agents/']})
        .then(function(res){ return res.json(); })
        .then(function(d){
            var list = (d && d.plugins) || [];
            var dm = (d && d.descriptions) || {};
            _cmdDescs = {};
            for (var k in dm) {
                if (Object.prototype.hasOwnProperty.call(dm, k)) {
                    _cmdDescs[k] = String(dm[k] || '');
                }
            }
            _cmdNames = list.map(function(n){ return String(n); });
            _cmdTs = Date.now();
            _cmdPromise = null;
            return _cmdNames;
        })
        .catch(function(){ _cmdNames = []; return _cmdNames; });
    return _cmdPromise;
}

function cmdActiveToken(el) {
    var pos = el.selectionStart;
    var before = el.value.slice(0, pos);
    var m = before.match(/(^|\s)\/([A-Za-z0-9_\-\/]*)$/);
    if (!m) return null;
    return {start: pos - m[2].length - 1, query: m[2]};
}

function fuzzyMatch(q, name) {
    if (!q) return true;
    var ql = q.toLowerCase(), nl = name.toLowerCase();
    if (nl.indexOf(ql) >= 0) return true;
    // 子序列模糊匹配
    var i = 0;
    for (var k = 0; k < nl.length && i < ql.length; k++) {
        if (nl[k] === ql[i]) i++;
    }
    return i === ql.length;
}

function renderCmdHint() {
    var box = document.getElementById('cmdHint');
    if (!box) return;
    if (!_cmdItems.length) { box.style.display = 'none'; return; }
    var html = '';
    for (var i = 0; i < _cmdItems.length; i++) {
        html += '<div class="cmd-item' + (i === _cmdIdx ? ' sel' : '') + '" data-idx="' + i + '">' +
                '<span class="cmd-name">' + escapeHtml(_cmdItems[i]) + '</span>' +
                '<span class="cmd-desc">' + escapeHtml(_cmdDescs[_cmdItems[i]] || '') + '</span></div>';
    }
    box.innerHTML = html;
    box.style.display = 'block';
    var items = box.querySelectorAll('.cmd-item');
    for (var j = 0; j < items.length; j++) {
        items[j].addEventListener('mousedown', function(e){ e.preventDefault(); pickCmdItem(parseInt(this.getAttribute('data-idx'), 10)); });
    }
}

function hideCmdHint() {
    var box = document.getElementById('cmdHint');
    if (box) box.style.display = 'none';
    _cmdItems = []; _cmdIdx = 0; _cmdStart = -1;
}

function pickCmdItem(idx) {
    var el = document.getElementById('msgInput');
    if (!el || idx < 0 || idx >= _cmdItems.length) return;
    var name = _cmdItems[idx];
    if (_cmdStart < 0) return;
    var pos = el.selectionStart;
    el.value = el.value.slice(0, _cmdStart) + name + el.value.slice(pos);
    var caret = _cmdStart + name.length;
    el.setSelectionRange(caret, caret);
    el.focus();
    hideCmdHint();
}

function refreshCmdHint() {
    var el = document.getElementById('msgInput');
    if (!el) return;
    var tk = cmdActiveToken(el);
    if (!tk) { hideCmdHint(); return; }
    loadCmdNames().then(function(names){
        var q = tk.query;
        var hits = names.filter(function(n){ return fuzzyMatch(q, n); });
        // 精确前缀优先
        hits.sort(function(a, b){
            var ap = a.toLowerCase().indexOf(q.toLowerCase()) === 0 ? 0 : 1;
            var bp = b.toLowerCase().indexOf(q.toLowerCase()) === 0 ? 0 : 1;
            if (ap !== bp) return ap - bp;
            return a.length - b.length;
        });
        _cmdItems = hits.slice(0, 20);
        _cmdIdx = 0;
        _cmdStart = tk.start;
        renderCmdHint();
    });
}

// ============ 回合状态 / 停止 ============
// _turnEpoch：每次主动发起/结束回合 +1。
// syncTurnState 发起请求时记住 epoch，回来时发现 epoch 变了 → 丢弃结果。
// 目的：防止异步返回的旧快照把「刚发出去的回合」误判成 idle 而提前解锁按钮。
var _turnEpoch = 0;
// _turnRunningConfirmed：本轮是否已由「用户主动发送」确认在跑。
// 为 true 时，只有「同一 epoch 的权威结果」（WS 终态 / interrupt 回包 / 同 epoch 的 sync）才能解锁。
var _turnRunningConfirmed = false;

function applyTurnState(running, status) {
    var sb = document.getElementById('sendBtn');
    var st = document.getElementById('stopBtn');
    var on = !!running;
    if (sb) sb.disabled = on;
    if (st) {
        st.disabled = (status === 'interrupting');
        st.style.display = on ? 'inline-flex' : 'none';
    }
}
function beginTurn() {
    _turnEpoch++;
    _turnRunningConfirmed = true;
    applyTurnState(true);
}
function endTurn() {
    _turnEpoch++;
    _turnRunningConfirmed = false;
    applyTurnState(false);
}
async function syncTurnState() {
    if (!currentConversationId) { applyTurnState(false); return; }
    var qid = currentConversationId;
    var ep = _turnEpoch;
    try {
        var res = await apiFetch('/api/builtins/agents/main_agent', { action: 'get_turn_state', session_id: qid });
        var resp = await res.json();
        var d = resp.payload || resp.data || resp;
        // 异步返回：期间用户可能已切会话 / 已发了新消息 / 已结束回合 → 结果作废
        if (currentConversationId !== qid) return;
        if (ep !== _turnEpoch) return;
        var ts = d.turn_state || {};
        var running = !!ts.running;
        // 本地刚发起的回合尚未在服务端登记 running（异步回合存在时间差）：
        // 此时「服务端说 idle」不可信，保持按钮态，等 WS 终态或下一轮 sync。
        if (!running && _turnRunningConfirmed) {
            setTimeout(function(){
                if (currentConversationId === qid && _turnEpoch === ep) syncTurnState();
            }, 1200);
            return;
        }
        _turnRunningConfirmed = running;
        applyTurnState(running, ts.status);
    } catch (e) {
        // 网络异常不能当成「回合结束」，否则一次抖动就把按钮解锁了
        if (currentConversationId === qid && ep === _turnEpoch && !_turnRunningConfirmed) {
            applyTurnState(false);
        }
    }
}
async function stopCurrentTurn() {
    var st = document.getElementById('stopBtn');
    if (st) { st.disabled = true; st.style.display = 'inline-flex'; }
    var sid = currentConversationId;
    try {
        var res = await apiFetch('/api/builtins/agents/main_agent', { action: 'interrupt', session_id: sid, content: '' });
        var resp = await res.json();
        var d = resp.payload || resp.data || resp;
        if (currentConversationId !== sid) return;
        if (d.ok === false || d.error) {
            endTurn();   // 没有活跃回合 / 已结束：直接回到空闲态
            showToast(d.error === 'no_active_turn' ? (t('msg.noActiveTurn') || 'No running task') : (d.error || 'Failed'));
        } else {
            applyTurnState(true, 'interrupting');
        }
    } catch (e) {
        // 网络失败不能假定回合已停：保持红按钮，让用户能再点一次；不直接解锁
        if (currentConversationId === sid && st) { st.disabled = false; st.style.display = 'inline-flex'; }
        showToast(t('msg.networkError') + e.message);
    }
}

// ============ 发送 ============
async function sendMessage() {
    var input = document.getElementById('msgInput');
    var text = input.value.trim();
    if (!text && !uploadedFiles.length) { showToast(t('msg.inputRequired')); return; }
    // ★ 已上传成功的文件：以结构化对象告知后端（主控自行决定如何处理），
    //   前端渲染时剥离该块、换成附件小卡片，用户看不到路径但主控拿得到。
    var _files = uploadedFiles.slice();
    if (_files.length) {
        var _att = _files.map(function(f){
            return JSON.stringify({name:f.name, path:f.path, url:f.url || '', size:f.size || 0});
        }).join('\n');
        text += (text ? '\n\n' : '') + '<attachments>\n' + _att + '\n</attachments>';
        uploadedFiles = [];   // 发送后清空，避免同一附件重复附加到下一条消息
        renderFilePreview();
    }
    // ★ 搜索无结果、聊天区被清空时拦住发送，提示先清搜索或选对话，避免误发到新建会话
    if (!currentConversationId && (document.getElementById('convSearchInput') || {}).value.trim()) {
        showToast(_lang === 'zh' ? '请先清空搜索或选择一个对话' : 'Clear search or pick a conversation first');
        return;
    }
    if (!currentConversationId) { await createNewConversation(); }
    var cur = conversations.find(function(c){ return c.id === currentConversationId; });
    if (cur && cur.archived) { showToast(t('msg.archivedWarn')); return; }
    addUserMessage(text);
    input.value = '';
    input.style.height = 'auto';
    beginTurn();   // 拉高 epoch + 锁定按钮，后续任何旧快照都作废
    try {
        var res = await apiFetch('/api/builtins/agents/main_agent', { content: text, session_id: currentConversationId, source: getSource() });
        var data = await res.json();
        if (data.status === 'processing' || data.call === 'processing') {
            // 异步回合：保持锁定，等 WS 的 reply_end / interrupted 事件来 endTurn()
        }
        else if (data.content) {
            addAssistantMessage(data.content);
            endTurn();
        }
        else if (data.error) {
            addAssistantMessage('❌ ' + data.error);
            endTurn();
        }
        setTimeout(function(){ _convListCache.ts = 0; refreshConversations(true); }, 1500);
    } catch(e) {
        addAssistantMessage('❌ ' + t('msg.networkError') + e.message);
        endTurn();
    }
}

async function reloadModel(force) {
    var box = document.getElementById('modelSel');
    var sel = document.getElementById('modelProviderSel');
    box.innerHTML = '<option>' + escapeHtml(t('common.loading')) + '</option>';
    try {
        var r1 = await apiFetch(API_MODEL_PICKER, {action:'current'});
        var j1 = await r1.json();
        var cur = j1.data || j1;
        _mpCurRef = cur.ref || '';
        _mpCurProvider = cur.provider || '';
        if (cur.model_id) _mpSel = _mpCurProvider ? _mpCurProvider + '/' + cur.model_id : cur.model_id;
        var mtEl = document.getElementById('mpMaxTokens');
        var tpEl = document.getElementById('mpTemperature');
        if (mtEl) mtEl.value = (cur.max_tokens !== null && cur.max_tokens !== undefined && cur.max_tokens !== '') ? cur.max_tokens : 32768;
        if (tpEl) tpEl.value = (cur.temperature !== null && cur.temperature !== undefined && cur.temperature !== '') ? cur.temperature : 0.1;

        var r2 = await apiFetch(API_MODEL_PICKER, {action:'list_providers'});
        var j2 = await r2.json();
        var d2 = j2.data || j2;
        _mpProviders = d2.providers || [];
        _mpMulti = !!d2.multi;
        _mpDefaultProvider = d2.default_provider || '';
        renderProviderList();

        // provider 选择：多 provider 才显示下拉框，否则隐藏
        var pbox = document.getElementById('mpProviderBox');
        if (pbox) pbox.style.display = _mpMulti ? '' : 'none';
        if (_mpMulti) {
            sel.innerHTML = _mpProviders.map(function(p){
                var label = p.provider + (p.name ? ' (' + p.name + ')' : '') + (p.has_key ? '' : ' ' + mpText('·无key','·no key'));
                return '<option value="' + escapeHtml(p.provider) + '">' + escapeHtml(label) + '</option>';
            }).join('');
            sel.value = _mpCurProvider || _mpDefaultProvider || (_mpProviders[0] ? _mpProviders[0].provider : '');
        } else {
            sel.innerHTML = '';
        }

        // 多 provider 时：优先选中全局指针 roles.default.model 里的 provider，
        // 其次是当前正在编辑的 provider；都没有就不预选，避免总是落到第一个。
        var curProvider = '';
        if (_mpMulti) {
            curProvider = _mpCurProvider || _mpEditingProvider || '';
            if (curProvider && !findProvider(curProvider)) curProvider = '';
            if (!curProvider) {
                for (var pi = 0; pi < _mpProviders.length; pi++) {
                    if (_mpProviders[pi].is_current) { curProvider = _mpProviders[pi].provider; break; }
                }
            }
            if (!curProvider) curProvider = _mpDefaultProvider || '';
            if (curProvider && sel.querySelector('option[value="' + curProvider.replace(/"/g, '&quot;') + '"]')) {
                sel.value = curProvider;
            }
        } else {
            curProvider = _mpDefaultProvider || _mpCurProvider || (_mpProviders[0] ? _mpProviders[0].provider : '');
        }
        _mpActiveProvider = curProvider;
        fillProviderFields(curProvider);

        await loadEndpointModels(curProvider, force);
    } catch(e) {
        box.innerHTML = '<option>' + escapeHtml(t('msg.loadFail') + ' ' + e.message) + '</option>';
    }
}

async function refreshProviders() {

function renderProviderList() {
    var list = document.getElementById('mpProviderList');
    if (!list) return;
    var seen = {};
    var html = '';
    _mpProviders.forEach(function(p) {
        var id = String(p.provider || '').trim();
        if (id && !seen[id]) {
            seen[id] = true;
            html += '<option value="' + escapeHtml(id) + '">';
        }
    });
    _MP_PRESETS.forEach(function(p) {
        if (p.id && !seen[p.id]) {
            seen[p.id] = true;
            html += '<option value="' + escapeHtml(p.id) + '">';
        }
    });
    list.innerHTML = html;
}

function findProvider(pn) {
    for (var i = 0; i < _mpProviders.length; i++) {
        if (_mpProviders[i].provider === pn) return _mpProviders[i];
    }
    return null;
}

function fillProviderFields(pn) {
    _mpEditingProvider = pn || '';
    var p = findProvider(pn);
    var nameEl = document.getElementById('mpProviderName');
    var urlEl = document.getElementById('mpBaseUrl');
    var keyEl = document.getElementById('mpApiKey');
    var tipEl = document.getElementById('mpKeyTip');
    if (nameEl) nameEl.value = p ? (p.provider || '') : '';
    if (urlEl) urlEl.value = p ? (p.base_url || '') : '';
    if (keyEl) keyEl.value = '';
    // provider 自己的默认模型（各存各的，互不干扰）
    _mpProviderDefaultModel = p ? (p.default_model || '') : '';
    _mpProviderId = p ? p.provider : (pn || '');
    var modeEl = document.getElementById('mpKeyMode');
    if (modeEl && !modeEl.options.length) {
        modeEl.innerHTML = '<option value="vault">' + mpText('明文(加密)','Plain (encrypted)') + '</option>'
                          + '<option value="env">' + mpText('环境变量','Env var') + '</option>';
    }
    if (modeEl) modeEl.value = (p && p.key_source === 'env') ? 'env' : 'vault';
    if (tipEl) {
        var src = p ? p.key_source : 'none';
        var masked = p ? (p.key_masked || '') : '';
        if (!p) tipEl.textContent = mpText('尚未配置 provider', 'Provider not configured yet');
        else if (src === 'env') tipEl.textContent = mpText('当前使用环境变量', 'Currently using env var') + (masked ? ' · ' + masked : '');
        else if (src === 'vault') tipEl.textContent = mpText('当前使用本地加密密钥库', 'Currently using local encrypted vault') + (masked ? ' · ' + masked : '');
        else if (src === 'plain') tipEl.textContent = mpText('当前为明文存储，建议改用加密或环境变量', 'Stored in plain text — recommend vault/env') + (masked ? ' · ' + masked : '');
        else tipEl.textContent = mpText('未配置密钥', 'No key configured');
        tipEl.dataset.base = tipEl.textContent;
    }
    _mpEnvVar = (p && p.key_source === 'env') ? (p.key_env_var || '') : '';
    keyModeChanged();
}

function keyModeChanged() {
    var modeEl = document.getElementById('mpKeyMode');
    var keyEl = document.getElementById('mpApiKey');
    var tipEl = document.getElementById('mpKeyTip');

function renderKeyStatus() {
    var stEl = document.getElementById('mpKeyStatus');
    if (!stEl) return;
    var modeEl = document.getElementById('mpKeyMode');
    var keyEl = document.getElementById('mpApiKey');
    var p = findProvider(_mpActiveProvider);
    var mode = modeEl ? modeEl.value : 'vault';
    var typed = keyEl ? keyEl.value.trim() : '';
    var ok = '<span style="color:var(--ok,#3fb950)">✓</span>';
    var warn = '<span style="color:var(--warn,#d29922)">⚠</span>';

    if (mode === 'env') {
        var varName = typed.replace(/^\$\{|\}$/g, '') || _mpEnvVar || '';
        if (!varName) {
            stEl.innerHTML = warn + ' ' + mpText('未填写环境变量名', 'No env var name given');
            return;
        }
        stEl.innerHTML = mpText('当前环境变量：', 'Env var: ') + '<code>' + escapeHtml(varName) + '</code>'
            + ' · ' + mpText('需在启动 AICP 的终端中自行 export', 'must be exported in the AICP terminal');
    } else {
        if (typed) {
            stEl.innerHTML = ok + ' ' + mpText('将保存新密钥（加密落盘）', 'New key will be saved (encrypted)');
        } else if (p && p.has_key) {
            stEl.innerHTML = ok + ' ' + mpText('已配置 ', 'Configured ') + escapeHtml(p.key_masked || '')
                + ' · ' + mpText('留空表示不修改', 'leave empty to keep');
        } else {
            stEl.innerHTML = warn + ' ' + mpText('未配置密钥', 'No key configured');
        }
    }
}

function presetChanged() {

async function loadEndpointModels(pn, force) {
    var box = document.getElementById('modelSel');
    var tip = document.getElementById('modelSourceTip');
    _mpCurProvider = pn || '';
    // 每个 provider 有自己的默认模型：切回来时优先恢复它
    var p = findProvider(pn);
    var ownDefault = p ? (p.default_model || '') : '';
    if (!ownDefault && _mpSelectedByProvider[pn]) {
        var savedRef = _mpSelectedByProvider[pn];
        ownDefault = savedRef.indexOf(pn + '/') === 0 ? savedRef.slice(pn.length + 1) : savedRef;
    }
    _mpSel = ownDefault ? (pn + '/' + ownDefault) : (_mpSelectedByProvider[pn] || '');
    _mpCurRef = _mpSel;
    box.innerHTML = '<option>' + escapeHtml(t('common.loading')) + '</option>';
    try {
        var res = await apiFetch(API_MODEL_PICKER, {action:'endpoint_models', provider: pn, force: !!force});
        var jd = await res.json();
        var data = jd.data || jd;
        _mpModels = data.models || [];
        if (data.source === 'endpoint') {
            tip.textContent = mpText('端点返回 ' + (_mpModels.length||0) + ' 个模型', (_mpModels.length||0) + ' models from endpoint');
        } else if (!_mpModels.length) {
            tip.innerHTML = '<span style="color:var(--warn,#d29922)">' + escapeHtml(mpText(
                '端点不可达或不支持 /models。请检查地址是否含 /v1、密钥是否正确；也可先保存再重试。',
                'Endpoint unreachable or does not support /models. Check the URL ends with /v1 and the key is valid; try saving first.')) + '</span>';
        } else {
            tip.textContent = data.note || mpText('仅显示已配置模型','configured models only');
        }
        renderModelList();
    } catch(e) {
        tip.innerHTML = '<span style="color:var(--warn,#d29922)">' + escapeHtml(mpText('拉取模型失败：','Failed to fetch models: ') + e.message) + '</span>';
        box.innerHTML = '<option>' + escapeHtml(t('msg.loadFail')) + '</option>';
    }
}

function renderModelList() {
    var sel = document.getElementById('modelSel');
    if (!sel) return;
    if (!_mpModels.length) { sel.innerHTML = '<option>' + escapeHtml(t('msg.noModels')) + '</option>'; _mpSel = ''; return; }
    var refs = _mpModels.map(function(m){ return m.ref || (_mpCurProvider + '/' + m.id); });
    sel.innerHTML = _mpModels.map(function(m, ix){
        var mark = (refs[ix] === _mpCurRef) ? '\u2713 ' : '';
        var tag = m.configured ? '' : mpText(' \u00b7 \u65b0', ' (new)');
        return '<option value="' + escapeHtml(refs[ix]) + '">' + mark + escapeHtml(m.id) + tag + '</option>';
    }).join('');
    // 选中优先级：provider 自己的 default_model > 本次会话已选 > 全局指针 > 第一个
    var target = '';
    var own = _mpProviderDefaultModel ? (_mpCurProvider + '/' + _mpProviderDefaultModel) : '';
    if (own && refs.indexOf(own) >= 0) {
        target = own;
    } else {
        var saved = _mpSelectedByProvider[_mpCurProvider] || '';
        var ci = refs.indexOf(_mpCurRef);
        if (saved && refs.indexOf(saved) >= 0) target = saved;
        else if (_mpSel && refs.indexOf(_mpSel) >= 0) target = _mpSel;
        else if (ci >= 0) target = _mpCurRef;
        else target = refs[0];
    }
    sel.value = target;
    _mpSel = sel.value || '';
    if (_mpCurProvider) _mpSelectedByProvider[_mpCurProvider] = _mpSel;
}

function pickModel(ref) {
    _mpSel = ref;
    if (_mpActiveProvider) _mpSelectedByProvider[_mpActiveProvider] = ref;
}

async function confirmModelSwitch() {
    if (_switching) return;
    var modelBox = document.getElementById('modelSel');
    var selectedRef = modelBox && modelBox.value ? modelBox.value : _mpSel;
    var parts = selectedRef ? selectedRef.split('/') : [];
    var selProvider = providerId();
    if (parts.length > 1 && parts[0] !== selProvider) {
        showToast(mpText('当前模型不属于所选 provider，请重新选择','The selected model belongs to another provider; please select again'));
        return;
    }
    var selModel = parts.length > 1 ? parts.slice(1).join('/') : (selectedRef || '');

    var nameEl = document.getElementById('mpProviderName');
    var urlEl = document.getElementById('mpBaseUrl');
    var keyEl = document.getElementById('mpApiKey');
    var modeEl = document.getElementById('mpKeyMode');
    var pname = nameEl ? nameEl.value.trim() : '';
    var purl = urlEl ? urlEl.value.trim() : '';
    var pkey = keyEl ? keyEl.value.trim() : '';
    var kmode = modeEl ? modeEl.value : 'vault';
    if (kmode === 'vault' && pkey && !/^sk-[A-Za-z0-9_\-]{6,}$/.test(pkey) && pkey.length < 8) {
        showToast(mpText('密钥格式可疑，请确认是否粘贴正确','Key looks suspicious'));
    }

    if (!selProvider) {
        showToast(mpText('请先填写 provider 名称并保存','Provider name is required'));
        return;
    }
    if (purl && !/^https?:\/\//i.test(purl)) {
        showToast(mpText('端点地址需以 http:// 或 https:// 开头','Base URL must start with http:// or https://'));
        return;
    }
    if (kmode === 'env' && pkey && !/^\$\{\w+\}$/.test(pkey) && !/^\w+$/.test(pkey)) {
        showToast(mpText('环境变量模式请填写变量名','Env mode: enter a variable name'));
        return;
    }

    var mtEl = document.getElementById('mpMaxTokens');
    var tpEl = document.getElementById('mpTemperature');
    var mtVal = mtEl && mtEl.value !== '' ? parseInt(mtEl.value, 10) : null;
    var tpVal = tpEl && tpEl.value !== '' ? parseFloat(tpEl.value) : null;
    if (mtVal !== null && (!isFinite(mtVal) || mtVal <= 0)) { showToast(mpText('max_tokens 必须是正整数','max_tokens must be a positive integer')); return; }
    if (tpVal !== null && (!isFinite(tpVal) || tpVal < 0 || tpVal > 2)) { showToast(mpText('temperature 需在 0-2 之间','temperature must be 0-2')); return; }
    _switching = true;
    try {
        // 1) 先保存 provider 配置（名称 / 端点 / 密钥）
        var sp = await apiFetch(API_MODEL_PICKER, {action:'save_provider', provider: selProvider, source_provider: _mpEditingProvider, name: pname, base_url: purl, api_key: pkey, key_mode: kmode});
        var jsp = await sp.json();
        var dp = jsp.data || jsp;
        if (dp.ok === false) { showToast('❌ ' + (dp.error || 'save failed')); _switching = false; return; }

        // 2) 先提交模型（用用户本次选的），再刷新 provider 列表
        //    顺序很关键：refreshProviders 会更新 default_model，必须先提交再刷新
        var data = null;
        if (selModel) {
            var res = await apiFetch(API_MODEL_PICKER, {action:'select_model', provider: selProvider, model_id: selModel, max_tokens: mtVal, temperature: tpVal});
            var js = await res.json();
            data = js.data || js;
            if (data.ok === false) {
                showToast('❌ ' + (data.error || t('msg.switchFail')));
                _switching = false;
                return;
            }
            _mpCurRef = data.ref; _mpCurProvider = data.provider;
            _mpSelectedByProvider[selProvider] = data.ref;
        }

        // 3) 刷新 provider 列表（此时磁盘上的 default_model 已是新值）
        _mpProviders = await refreshProviders();
        renderKeyStatus();

        if (!selModel) {
            showToast(mpText('已保存 provider 配置','Provider saved') + (dp.note ? ' · ' + dp.note : ''));
            closeModelModal();
            _switching = false;
            return;
        }
        document.getElementById('currentModelDisplay').textContent = data.model_id;
        showToast(t('msg.switched') + ' ' + data.model_id);
        closeModelModal();
    } catch(e) { showToast('❌ ' + t('msg.switchFail') + e.message); }
    _switching = false;
}

async function checkLLMConfigured() {
    try {
        var res = await apiFetch(API_MODEL_PICKER, {action:'list_providers'});
        var j = await res.json();

        var providers = d.providers || [];
        if (!providers.length) { openModelModal(); return; }
        var anyKey = providers.some(function(p){ return p.has_key; });
        var hasDefault = !!(d.default_provider);
        if (!anyKey || !hasDefault) { openModelModal(); }
    } catch(e) {}
}

function openSubTaskModal() { document.getElementById('subTaskModalOverlay').classList.add('show'); reloadSubTasks(); }
function closeSubTaskModal() { document.getElementById('subTaskModalOverlay').classList.remove('show'); }
async function reloadSubTasks() {
    var box = document.getElementById('subTaskList');
    box.innerHTML = '<option>' + escapeHtml(t('common.loading')) + '</option>';
    try {
        var res = await apiFetch('/api/builtins/tools/task_manager', {action:'list', params:{}, meta:{session_id:currentConversationId}});
        var raw = await res.json();
        var data = raw.data || raw;
        var payload = data.data || data;
        var tasks = payload.tasks || [];
        _subTasks = {};
        tasks.forEach(function(tk){ _subTasks[tk.task_id] = tk; });
        renderSubTaskList();
        if (_selectedSubTask && !_subTasks[_selectedSubTask]) {
            _selectedSubTask = null;
            document.getElementById('subTaskDetail').innerHTML = '<div class="empty-state">' + t('modal.selectSub') + '</div>';
        }
    } catch(e) { box.innerHTML = '<option>' + escapeHtml(t('msg.loadFail') + ' ' + e.message) + '</option>'; }
}
function renderSubTaskList() {
    var box = document.getElementById('subTaskList');
    var ids = Object.keys(_subTasks);
    if (ids.length === 0) { box.innerHTML = '<div class="empty-state" style="padding:20px 0">' + t('msg.noSubTasks') + '</div>'; return; }
    ids.sort(function(a,b){ return (_subTasks[a].created_at||'').localeCompare(_subTasks[b].created_at||''); });
    var html = '';
    ids.forEach(function(tid){
        var tk = _subTasks[tid];
        var status = tk.status || 'unknown';
        var icon = {'pending':'📝','running':'⏳','done':'✅','failed':'❌','timeout':'⏰','cancelled':'🚫'}[status] || '?';
        var isSel = (_selectedSubTask === tid);
        var style = isSel ? 'background:var(--brand-soft);border-color:rgba(94,106,210,0.3)' : 'border-color:var(--border)';
        html += '<div onclick="selectSubTask(\''+escapeHtml(tid)+'\')" style="padding:10px 12px;border:1px solid;border-radius:8px;margin-bottom:4px;cursor:pointer;transition:.15s;'+style+'">';
        html += '  <div style="font-size:12px;font-weight:500;color:var(--text)">' + icon + ' ' + escapeHtml(tid) + '</div>';
        html += '  <div style="font-size:10px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(tk.description||'') + '</div>';
        html += '  <div style="font-size:10px;color:var(--brand);margin-top:2px">' + escapeHtml(status) + '</div>';
        html += '</div>';
    });
    box.innerHTML = html;
}
async function selectSubTask(taskId) {
    _selectedSubTask = taskId;
    renderSubTaskList();
    var detail = document.getElementById('subTaskDetail');
    detail.innerHTML = '<div class="loading">' + t('common.loading') + '</div>';
    try {
        var res1 = await apiFetch('/api/builtins/tools/task_manager', {action:'collect', params:{task_id:taskId}, meta:{session_id:currentConversationId}});
        var raw1 = await res1.json();
        var payload1 = (raw1.data || raw1).data || raw1.data || raw1;
        var task = payload1 || {};
        var flow = [];
        try {
            var res2 = await apiFetch('/api/builtins/agents/main_agent', {action:'get_session', session_id:taskId});
            var raw2 = await res2.json();
            if (raw2.ok && raw2.flow) flow = raw2.flow;
        } catch(e) {}
        var html = '';
        html += '<div style="margin-bottom:12px"><div style="font-size:13px;font-weight:600;font-family:var(--font-mono);color:var(--text)">' + escapeHtml(taskId) + '</div>';
        html += '<div style="font-size:12px;color:var(--text-3);margin-top:4px">' + escapeHtml(task.description||'') + '</div></div>';
        html += '<div style="font-size:11px;color:var(--text-3);margin-bottom:8px">' + (_lang === 'zh' ? '状态' : 'Status') + ': <span style="color:var(--brand);font-weight:600">' + escapeHtml(task.status||'?') + '</span></div>';
        if (task.task) html += '<div style="margin:12px 0;padding:8px 10px;background:var(--surface-2);border-radius:6px;font-size:11px;white-space:pre-wrap;color:var(--text-2);border:1px solid var(--border)">' + escapeHtml(task.task) + '</div>';
        if (flow && flow.length > 0) {
            html += '<div style="font-size:12px;font-weight:600;color:var(--text-3);margin:12px 0 8px">' + (_lang === 'zh' ? '执行过程（' + flow.length + ' 条）' : 'Execution (' + flow.length + ' entries)') + '</div>';
            flow.forEach(function(entry){
                if (entry.from === 'user') html += '<div style="padding:6px 10px;background:var(--brand-soft);border-left:2px solid var(--brand);border-radius:0 4px 4px 0;margin-bottom:4px;font-size:11px;white-space:pre-wrap;color:var(--text)">👤 ' + escapeHtml(entry.content||'') + '</div>';
                else if (entry.from === 'ai' && entry.call === 'reply' && entry.content) html += '<div style="padding:6px 10px;background:var(--ok-soft);border-left:2px solid var(--ok);border-radius:0 4px 4px 0;margin-bottom:4px;font-size:11px;white-space:pre-wrap;color:var(--text)">🤖 ' + escapeHtml(entry.content) + '</div>';
                else if (entry.from === 'system' && entry.action === 'call_start') html += '<div style="padding:4px 10px;background:var(--surface-2);border-radius:4px;margin-bottom:4px;font-size:11px;color:var(--text-3);border:1px solid var(--border)">📤 ' + escapeHtml((entry.detail||{}).target||'') + '</div>';
            });
        } else { html += '<div class="empty-state" style="padding:20px 0">' + t('msg.loadFailShort') + '</div>'; }
        if (task.result) {
            html += '<div style="font-size:12px;font-weight:600;color:var(--text-3);margin:16px 0 8px">' + (_lang === 'zh' ? '结果' : 'Result') + '</div>';
            html += '<pre style="padding:8px 10px;background:var(--ok-soft);border-left:2px solid var(--ok);border-radius:0 6px 6px 0;font-size:11px;white-space:pre-wrap;max-height:300px;overflow-y:auto;color:var(--text)">' + escapeHtml(typeof task.result === 'object' ? JSON.stringify(task.result, null, 2) : String(task.result)) + '</pre>';
        }
        if (task.error) {
            html += '<div style="font-size:12px;font-weight:600;color:var(--text-3);margin:16px 0 8px">' + (_lang === 'zh' ? '错误' : 'Error') + '</div>';
            html += '<pre style="padding:8px 10px;background:var(--err-soft);border-left:2px solid var(--err);border-radius:0 6px 6px 0;font-size:11px;white-space:pre-wrap;max-height:300px;overflow-y:auto;color:var(--err)">' + escapeHtml(task.error) + '</pre>';
        }
        detail.innerHTML = html;
    } catch(e) { detail.innerHTML = '<div class="empty-state">' + t('msg.loadFail') + escapeHtml(e.message) + '</div>'; }
}

async function handleFiles(files) {

async function uploadFile(file) {
    try {
        var fd = new FormData();
        fd.append('file', file);
        fd.append('session_id', currentConversationId || 'default');
        var cfg = await fetch('/api/upload_config').then(function(r){return r.json();});
        var url = cfg.url || '/upload';
        var headers = {};
        var token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        var res = await fetch(url, {method:'POST', body:fd, headers:headers});
        var data = await res.json();
        if (data.success) {
            // ★ 同时记录：绝对路径（后端用）+ 静态 URL（前端预览/下载用）
            uploadedFiles.push({name:file.name, path:data.file_path, url:data.url || '', size:data.file_size || file.size});
            fileList = fileList.filter(function(f){return f !== file;});
            showToast('✅ ' + file.name);
        } else {
            fileList = fileList.filter(function(f){return f !== file;});
            showToast('❌ ' + (data.error || file.name));
        }
    } catch(e) {
        fileList = fileList.filter(function(f){return f !== file;});
        showToast('❌ ' + e.message);
    }
    renderFilePreview();
}

// ============ 粘贴自动转附件 ============
// 规则：
//   1. 剪贴板里有文件（图片等）→ 直接当附件上传，文件名取原名
//   2. 纯文本且长度 > PASTE_TEXT_MAX → 自动生成附件（.json/.md/.txt 智能识别）
//   3. 短文本 → 走浏览器默认粘贴行为（正常进输入框）
// 4. 原文件名：优先从 text/uri-list 的 file:// 路径提取，取不到用兜底名
var PASTE_TEXT_MAX = 300;   // 超过多少字符的纯文本自动转附件

// 从剪贴板事件里找出原始文件名（浏览器在部分平台会带 text/uri-list）
function pasteOriginalName(dt) {
    try {
        var uri = dt.getData('text/uri-list');
        if (uri) {
            var lines = uri.split(/\r?\n/).filter(function(l){ return l && l.trim(); });
            for (var i = 0; i < lines.length; i++) {
                var l = lines[i].trim();
                if (l.indexOf('#') > 0) l = l.split('#')[0];
                if (l.slice(0, 7).toLowerCase() !== 'file://') continue;
                var p = decodeURIComponent(l.slice(7).replace(/^localhost/i, ''));
                p = p.replace(/\\/g, '/');
                var base = p.split('/').pop();
                if (base && base.indexOf('.') > 0) return base;
            }
        }
    } catch(e) {}
    return '';
}

// 根据文本内容猜扩展名：JSON → .json，Markdown → .md，否则 .txt
function guessTextExt(text) {
    var t = (text || '').trim();
    if (!t) return 'txt';
    if ((t[0] === '{' && t[t.length-1] === '}') || (t[0] === '[' && t[t.length-1] === ']')) {
        try { JSON.parse(t); return 'json'; } catch(e) {}
    }
    // Markdown 特征：标题 / 列表 / 代码块 / 表格 / 链接
    if (/^#{1,6}\s+\S/m.test(t) || /^\s*[-*+]\s+\S/m.test(t) || /```/.test(t)
        || /^\s*\|.*\|\s*$/m.test(t) || /^\s*\d+\.\s+\S/m.test(t)
        || /\[[^\]]*\]\([^)]*\)/.test(t)) {
        return 'md';
    }
    return 'txt';
}

// 生成一个可读的名字：clipboard_20261106_125330.txt
function pasteAutoName(ext) {
    var d = new Date();
    function p(n){ return (n < 10 ? '0' : '') + n; }
    return 'clipboard_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
        + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.' + ext;
}

function uploadBlob(blob, filename) {
    var fd = new FormData();
    fd.append('file', blob, filename);
    fd.append('session_id', currentConversationId || 'default');
    var cfg = fetch('/api/upload_config').then(function(r){ return r.json(); });
    return cfg.then(function(c) {
        var url = (c && c.url) || '/upload';
        var headers = {};
        var token = getToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return fetch(url, {method:'POST', body:fd, headers:headers}).then(function(r){ return r.json(); });
    }).then(function(data) {
        if (data && data.success) {
            uploadedFiles.push({name: data.file_name || filename, path:data.file_path, url:data.url || '', size:data.file_size || blob.size});
            showToast('📎 ' + (data.file_name || filename));
        } else {
            showToast('❌ ' + ((data && data.error) || filename));
        }
        renderFilePreview();
    }).catch(function(e) {
        showToast('❌ ' + e.message);
    });
}

function handlePaste(e) {
    var dt = e.clipboardData;
    if (!dt) return;

    // 情况 1：剪贴板里有文件（图片等）→ 直接上传
    var files = [];
    if (dt.files && dt.files.length) {
        for (var i = 0; i < dt.files.length; i++) files.push(dt.files[i]);
    } else if (dt.items && dt.items.length) {
        for (var j = 0; j < dt.items.length; j++) {
            if (dt.items[j].kind === 'file') {
                var f = dt.items[j].getAsFile();
                if (f) files.push(f);
            }
        }
    }
    if (files.length) {
        e.preventDefault();
        var origName = pasteOriginalName(dt);
        files.forEach(function(file, idx) {
            var name = file.name || (idx === 0 ? origName : '') || pasteAutoName('png');
            if (!/\.[A-Za-z0-9]+$/.test(name)) {
                name = pasteAutoName((file.type || '').split('/')[1] || 'png');
            }
            uploadBlob(file, name);
        });
        return;
    }

    // 情况 2：纯文本
    var text = dt.getData('text/plain') || dt.getData('text') || '';
    if (text.length > PASTE_TEXT_MAX) {
        e.preventDefault();
        var ext = guessTextExt(text);
        var fname = pasteOriginalName(dt) || pasteAutoName(ext);
        if (!/\.(json|md|txt|markdown)$/i.test(fname)) fname = pasteAutoName(ext);
        uploadBlob(new Blob([text], {type:'text/plain;charset=utf-8'}), fname);
    }
    // 情况 3：短文本 → 不拦截，走默认粘贴
}

document.getElementById('msgInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (_cmdItems.length) { pickCmdItem(_cmdIdx); return; }
        sendMessage(); return;
    }
    if (e.key === 'ArrowDown' && _cmdItems.length) { e.preventDefault(); _cmdIdx = (_cmdIdx + 1) % _cmdItems.length; renderCmdHint(); return; }
    if (e.key === 'ArrowUp' && _cmdItems.length) { e.preventDefault(); _cmdIdx = (_cmdIdx - 1 + _cmdItems.length) % _cmdItems.length; renderCmdHint(); return; }
    if (e.key === 'Tab' && _cmdItems.length) { e.preventDefault(); pickCmdItem(_cmdIdx); return; }
    if (e.key === 'Escape' && _cmdItems.length) { hideCmdHint(); return; }
});
