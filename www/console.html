<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>AICP BIO-1 · Console</title>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<style>
/* ============ Linear 深色 Token ============ */
:root{
  --bg:#08090A;
  --surface:#16171C;
  --surface-2:#1E1F25;
  --surface-3:#25262D;
  --border:rgba(255,255,255,0.06);
  --border-strong:rgba(255,255,255,0.10);
  --text:#F7F8F8;
  --text-2:#B4B8C0;
  --text-3:#8A8F98;
  --text-4:#5C6068;
  --brand:#5E6AD2;
  --brand-hover:#6E79DB;
  --brand-soft:rgba(94,106,210,0.12);
  --ok:#4CB782;
  --ok-soft:rgba(76,183,130,0.10);
  --err:#E5484D;
  --err-soft:rgba(229,72,77,0.10);
  --warn:#D9A441;
  --warn-soft:rgba(217,164,65,0.10);
  --radius:10px;
  --radius-sm:6px;
  --chat-width:720px;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,sans-serif;
  --font-mono:'SF Mono',Menlo,Consolas,'Courier New',monospace;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--text);
  display:flex;
  font-size:13px;
  -webkit-font-smoothing:antialiased;
  letter-spacing:0;
}

/* ============ 左侧栏（通顶） ============ */
.sidebar{
  width:260px;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
  z-index:20;transition:width .22s ease;
  overflow:hidden;
  height:100vh;
}

/* 品牌行（原顶栏内容） */
.sidebar-brand{
  display:flex;align-items:center;gap:8px;
  padding:0 12px;height:48px;
  flex-shrink:0;
  border-bottom:1px solid var(--border);
  position:relative;
}
.brand-mark{
  width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,#5E6AD2,#8B5CF6);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#fff;
  flex-shrink:0;
  text-decoration:none;
}
.brand-name{
  font-size:13px;font-weight:600;color:var(--text);
  flex:1;white-space:nowrap;overflow:hidden;
  display:flex;align-items:baseline;gap:5px;
}
.brand-name .sub{
  color:var(--text-3);font-weight:400;font-size:11px;
}
.lang-toggle{
  display:flex;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:2px;gap:2px;height:24px;align-items:center;
  flex-shrink:0;
}
.lang-toggle button{
  border:none;background:transparent;
  padding:2px 7px;border-radius:4px;
  font-size:10px;font-weight:500;height:18px;
  color:var(--text-3);cursor:pointer;font-family:inherit;
  transition:.15s;line-height:1;
}
.lang-toggle button.active{background:var(--surface-3);color:var(--text)}
.collapse-btn{
  background:transparent;border:none;
  color:var(--text-3);cursor:pointer;
  width:24px;height:24px;border-radius:4px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;font-size:14px;line-height:1;
}
.collapse-btn:hover{background:var(--surface-2);color:var(--text)}

.sidebar-search{padding:12px 12px 8px;flex-shrink:0}
.sidebar-search input{
  width:100%;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:7px 11px;color:var(--text);font-size:12px;
  outline:none;font-family:inherit;transition:.15s;
}
.sidebar-search input:focus{border-color:var(--brand);background:var(--bg)}
.sidebar-search input::placeholder{color:var(--text-4)}

.new-conv-btn{
  margin:0 12px 10px;
  background:var(--brand);color:#fff;border:none;
  border-radius:var(--radius-sm);padding:8px;
  font-size:12px;cursor:pointer;font-weight:500;
  font-family:inherit;transition:.15s;height:32px;
  white-space:nowrap;
}
.new-conv-btn:hover{background:var(--brand-hover)}

.conv-list{flex:1;overflow-y:auto;padding:0 8px}
.conv-item{
  padding:9px 10px;margin-bottom:4px;
  border-radius:var(--radius-sm);cursor:pointer;
  border:1px solid transparent;transition:.15s;position:relative;
}
.conv-item:hover{background:var(--surface-2)}
.conv-item.active{
  background:rgba(94,106,210,0.22);
  border-color:rgba(94,106,210,0.55);
  box-shadow:inset 3px 0 0 var(--brand);
}
.conv-item.active .conv-title{color:var(--brand);font-weight:600}
.conv-item.active:hover{
  background:rgba(94,106,210,0.28);
}
.conv-item .conv-title{
  font-size:12px;font-weight:500;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.conv-item .conv-preview{
  font-size:11px;color:var(--text-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.conv-item.active .conv-preview{color:var(--text-2)}
.conv-item .conv-meta{
  font-size:10px;color:var(--text-4);margin-top:2px;
  display:flex;gap:6px;
}
.conv-item .conv-del{
  float:right;color:var(--err);font-size:11px;cursor:pointer;
  padding:0 3px;opacity:0;transition:.15s;
}
.conv-item:hover .conv-del{opacity:1}
.conv-item.conv-sub{
  margin-left:10px;border-left:2px solid rgba(94,106,210,0.3);
  padding-left:8px;
}
.conv-item.conv-sub .conv-title{font-size:11px;color:var(--text-2)}

.conv-item.conv-archived{
  opacity:.55;
}
.conv-item.conv-archived .conv-title{
  color:var(--text-3);
}
.conv-item.conv-archived .conv-preview{
  color:var(--text-4);
}
.conv-lock{
  margin-left:4px;
  font-size:11px;
  vertical-align:middle;
}

.sidebar-footer{
  display:flex;padding:6px;gap:4px;
  border-top:1px solid var(--border);flex-shrink:0;
  background:var(--surface);
}
.footer-nav-btn{
  flex:1;background:transparent;border:1px solid transparent;
  border-radius:var(--radius-sm);padding:6px;
  color:var(--text-3);font-size:11px;cursor:pointer;
  font-family:inherit;transition:.15s;font-weight:500;
  height:32px;display:inline-flex;align-items:center;justify-content:center;
  gap:4px;white-space:nowrap;
}
.footer-nav-btn:hover{background:var(--surface-2);color:var(--text-2)}
.footer-nav-btn.active{
  background:var(--brand-soft);color:var(--brand);
  border-color:rgba(94,106,210,0.2);
}

/* 系统按钮行（重启/退出） */
.sidebar-actions{
  display:flex;padding:6px;gap:4px;
  border-top:1px solid var(--border);flex-shrink:0;
  background:var(--surface);
}
.action-btn{
  flex:1;background:transparent;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:5px;
  color:var(--text-3);font-size:11px;cursor:pointer;
  font-family:inherit;transition:.15s;
  height:26px;display:inline-flex;align-items:center;justify-content:center;
  gap:4px;white-space:nowrap;
}
.action-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}

/* ============ 侧栏收起态 ============ */
.sidebar.collapsed{width:56px}
.sidebar.collapsed .brand-name,
.sidebar.collapsed .lang-toggle,
.sidebar.collapsed .sidebar-search,
.sidebar.collapsed .new-conv-btn,
.sidebar.collapsed .conv-list,
.sidebar.collapsed .footer-nav-btn .txt,
.sidebar.collapsed .action-btn .txt{display:none}

/* 收起态品牌行：只留 A 居中 */
.sidebar.collapsed .sidebar-brand{
  flex-direction:column;padding:8px 0;height:auto;
  gap:4px;justify-content:center;align-items:center;
}
.sidebar.collapsed .brand-mark{
  margin:0 auto;
}
.sidebar.collapsed .collapse-btn{
  margin:0 auto;
}

/* 收起态底部图标：贴左一列 */
.sidebar.collapsed .sidebar-footer{
  flex-direction:column;padding:6px 0;gap:0;
  align-items:stretch;
}
.sidebar.collapsed .footer-nav-btn{
  flex:0 0 auto;width:56px;height:36px;
  padding:0;border-radius:0;font-size:16px;
  justify-content:center;border:none;
  border-left:2px solid transparent;
}
.sidebar.collapsed .footer-nav-btn.active{
  border-left:2px solid var(--brand);
  background:var(--brand-soft);
  color:var(--brand);
  border-radius:0;
}
.sidebar.collapsed .sidebar-actions{
  flex-direction:column;padding:6px 0;gap:0;
}
.sidebar.collapsed .action-btn{
  flex:0 0 auto;width:56px;height:32px;
  padding:0;border:none;border-radius:0;font-size:14px;
  border-left:2px solid transparent;
}
.sidebar.collapsed .action-btn:hover{
  background:var(--surface-2);
}

/* ============ 主区（通顶） ============ */
.main{
  flex:1;display:flex;overflow:hidden;min-height:0;min-width:0;
  position:relative;height:100vh;
}

/* ============ 聊天面板 ============ */
.panel{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;min-width:0;position:relative}
.panel.active{display:flex}

/* 悬浮对话标题（常驻顶部，不随消息滚动、不被消息顶掉） */
.chat-title-float{
  position:absolute;
  top:0;left:0;right:0;
  height:32px;
  display:flex;align-items:center;
  padding:0 24px;
  z-index:6;
  pointer-events:none;
  background:var(--bg);
  border-bottom:1px solid var(--border);
  transition:opacity .25s;
}
.chat-title-float .title-text{
  font-size:11px;font-weight:500;color:var(--text-3);
  max-width:var(--chat-width);margin:0;width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  pointer-events:auto;cursor:default;
}
.chat-title-float .title-text .rename-hint{
  margin-left:6px;color:var(--text-4);cursor:pointer;
  pointer-events:auto;font-size:11px;
}
.chat-title-float .title-text .rename-hint:hover{color:var(--text-2)}
/* 右上角 webview 拉出按钮（固定在面板右上角） */
.webview-toggle-btn{
  position:absolute;top:5px;right:12px;z-index:20;
  width:24px;height:24px;
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border:none;border-radius:var(--radius-sm);
  color:var(--text-4);cursor:pointer;
  transition:.15s;
}
.webview-toggle-btn:hover{background:var(--surface-2);color:var(--text-2)}
.webview-toggle-btn svg{width:14px;height:14px;stroke-width:1.8}
.webview-toggle-btn.hidden{display:none}

/* 消息区 */
.messages{
  flex:1;overflow-y:auto;
  padding:40px 24px 16px;
  display:flex;flex-direction:column;align-items:center;
}
.messages-inner{
  width:100%;max-width:var(--chat-width);
  display:flex;flex-direction:column;gap:20px;
}

/* 空状态 */
.empty-chat{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;text-align:center;padding:40px 20px;
}
.empty-mark{
  width:56px;height:56px;border-radius:14px;
  background:linear-gradient(135deg,#5E6AD2,#8B5CF6);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;color:#fff;
  margin-bottom:16px;
}
.empty-title{
  font-size:18px;font-weight:600;color:var(--text);
  margin-bottom:8px;
}
.empty-desc{font-size:13px;color:var(--text-3);line-height:1.55;max-width:360px}

/* ============ 回合卡片 ============ */
.turn{margin-bottom:16px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.msg{max-width:85%;display:flex;flex-direction:column;gap:4px}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.user .bubble{
    background:#e94560;
    color:#fff;
    border-radius:16px 16px 4px 16px;
    padding:10px 14px;
    font-size:12px;
    line-height:1.6;
    letter-spacing:0;
    word-break:break-word;
    white-space:pre-wrap;
}
.msg.assistant .bubble{
    background:rgba(255,255,255,.07);
    color:#e0e0e0;
    border-radius:16px 16px 16px 4px;
    padding:10px 14px;
    font-size:12px;
    line-height:1.6;
    letter-spacing:0;
    word-break:break-word;
}

/* ★ 段间距压到 4px（弹窗无段间距的关键） */
.msg.assistant .bubble p{
    margin:0;
}
.msg.assistant .bubble p + p{
    margin-top:4px;
}
.msg.assistant .bubble ul,
.msg.assistant .bubble ol{
    margin:4px 0;
    padding-left:20px;
}
.msg.assistant .bubble li{
    margin:1px 0;
}

/* 代码：字号 11 对齐弹窗，行高 1.6 */
.msg.assistant .bubble pre{
    background:#1a1a2e;
    padding:8px 12px;
    border-radius:6px;
    overflow-x:auto;
    font-size:11px;
    line-height:1.6;
    margin:6px 0;
    font-family:"SF Mono",Consolas,monospace;
}
.msg.assistant .bubble code{
    background:rgba(255,255,255,.1);
    padding:1px 6px;
    border-radius:3px;
    font-size:12px;
    font-family:"SF Mono",Consolas,monospace;
}

/* 表格 / 引用 / 标题对齐弹窗 */
.msg.assistant .bubble table{
    border-collapse:collapse;
    margin:6px 0;
    font-size:12px;
}
.msg.assistant .bubble th,
.msg.assistant .bubble td{
    border:1px solid rgba(255,255,255,.15);
    padding:4px 10px;
}
.msg.assistant .bubble th{background:rgba(255,255,255,.04)}
.msg.assistant .bubble blockquote{
    border-left:3px solid rgba(255,255,255,.2);
    padding:4px 12px;
    color:#aaa;
    margin:6px 0;
    font-size:12px;
}
.msg.assistant .bubble h1,
.msg.assistant .bubble h2,
.msg.assistant .bubble h3{font-size:13px;margin:8px 0 4px;font-weight:600;}
.msg.assistant .bubble a{color:#4a90d9;text-decoration:underline}
.msg .time{font-size:10px;color:#555;padding:0 4px;letter-spacing:0.3px;}
/* ============ 输入区 ============ */
.input-wrap{
  padding:0 24px 16px;
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;
}
.input-inner{
  width:100%;max-width:var(--chat-width);
  display:flex;flex-direction:column;gap:6px;
}
#filePreview{display:flex;flex-wrap:wrap;gap:4px;width:100%}
#filePreview span{
  background:var(--surface-2);color:var(--text-2);
  padding:3px 10px;border-radius:5px;font-size:11px;
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);
}
.input-row{display:flex;gap:8px;align-items:flex-end}
.icon-btn-round{
  width:38px;height:38px;border-radius:50%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text-3);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;
}
.icon-btn-round:hover{
  border-color:var(--border-strong);
  color:var(--text-2);
  background:var(--surface-2);
}
.icon-btn-round svg{width:16px;height:16px;stroke-width:1.8}
.send-btn{
  background:var(--brand);border-color:var(--brand);color:#fff;
}
.send-btn:hover:not(:disabled){
  background:var(--brand-hover);border-color:var(--brand-hover);color:#fff;
}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-btn svg{width:16px;height:16px;stroke-width:2}
.stop-btn{background:#c0392b;border-color:#c0392b;color:#fff}
.stop-btn:hover:not(:disabled){background:#e74c3c;border-color:#e74c3c}
.stop-btn:disabled{opacity:.4;cursor:not-allowed}
.stop-btn svg{width:14px;height:14px;stroke-width:2.2;fill:currentColor}
.input-textarea{
  flex:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px 14px;
  font-size:13px;color:var(--text);
  resize:none;outline:none;
  min-height:38px;max-height:140px;
  line-height:1.5;font-family:inherit;
  transition:.15s;
}
.input-textarea:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(94,106,210,0.15);
}
.input-textarea::placeholder{color:var(--text-4)}

/* ============ 插件自动补全（/ 前缀） ============ */
.input-inner{position:relative}
.cmd-hint{
  position:absolute;left:46px;right:0;bottom:calc(100% + 6px);
  z-index:60;min-width:240px;max-height:264px;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.30);
  padding:4px;
}
.cmd-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;border-radius:7px;cursor:pointer;
}
.cmd-item:hover{background:var(--surface-2)}
.cmd-item.sel{background:var(--brand-soft)}
.cmd-item .cmd-name{
  font-family:var(--font-mono);font-size:12px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:0 0 auto;max-width:46%;
}
.cmd-item.sel .cmd-name{color:var(--brand)}
.cmd-item .cmd-desc{
  flex:1 1 auto;min-width:0;
  font-size:11px;color:var(--text-3);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cmd-item.sel .cmd-desc{color:var(--text-2)}
.cmd-item .cmd-desc:empty{display:none}

/* ============ 工具链 ============ */
.tool-chain{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:2px 0;
}
.tool-node{
  display:inline-flex;flex-direction:column;align-items:flex-start;
  gap:2px;padding:6px 11px;border-radius:8px;
  font-size:11px;border:1px solid;
  cursor:pointer;transition:.2s;max-width:280px;
  background:var(--surface);
}
.tool-node .tool-think{
  font-size:10px;color:var(--text-3);font-style:italic;
  line-height:1.3;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:100%;cursor:help;
}
.tool-node .tool-action{
  font-size:11px;color:var(--text-2);font-family:var(--font-mono);
  line-height:1.3;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:100%;
}
.tool-node .tool-args{
  font-size:11px;color:var(--text-2);font-family:var(--font-mono);
  line-height:1.45;max-width:100%;overflow:hidden;
}
.tool-node .tool-args .k{color:var(--text-3);}
.tool-node .tool-args .v{color:var(--text-2);}
.tool-node .tool-args .arg-row{
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.tool-node .tool-name-row{
  display:flex;align-items:center;gap:6px;
  font-family:var(--font-mono);
}
.tool-node .tool-name{font-weight:500;font-size:11px}
.tool-node .dur{font-size:10px;opacity:.7}

.tool-node.running{
  border-color:rgba(94,106,210,0.5);color:#8E97E5;
  background:var(--brand-soft);animation:pulse 1.2s ease-in-out infinite;
}
.tool-node.ok{
  border-color:rgba(76,183,130,0.4);color:var(--ok);background:var(--ok-soft);
}
.tool-node.error{
  border-color:rgba(229,72,77,0.4);color:var(--err);background:var(--err-soft);
}
.tool-node.interrupted{
  border-color:rgba(217,164,65,0.4);color:var(--warn);background:var(--warn-soft);
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.tool-arrow{color:var(--text-4);font-size:11px}

.thinking-line{
  font-size:12px;color:var(--text-3);font-style:italic;
  padding:2px 0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;animation:blink 1.5s infinite;
  transition:opacity .3s;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}

/* ============ Webview 右侧 split ============ */
.webview-panel{
  display:none;
  width:50%;
  flex-shrink:0;
  background:var(--surface);
  border-left:1px solid var(--border);
  flex-direction:column;
  z-index:15;
  /* 让出底部状态栏高度：webview 上移，底部不被 footer 遮住 */
  height:calc(100vh - 22px);
}
.webview-panel.show{display:flex}
.webview-header{
  display:flex;align-items:center;gap:8px;
  padding:0 12px;height:40px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;background:var(--surface);
}
.webview-title{
  flex:1;font-size:11px;font-weight:500;
  color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:var(--font-mono);
}
.webview-actions{display:flex;gap:4px}
.webview-actions button{
  width:26px;height:26px;border-radius:var(--radius-sm);
  background:transparent;border:none;
  color:var(--text-3);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:.15s;
}
.webview-actions button:hover{background:var(--surface-2);color:var(--text)}
.webview-actions button svg{width:13px;height:13px;stroke-width:1.8}
.webview-body{flex:1;overflow:hidden;background:var(--bg)}
.webview-body iframe{
  width:100%;height:100%;border:none;background:var(--bg);
}

/* ============ 弹窗 ============ */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(4px);
  z-index:1000;align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:14px;
  width:90%;max-width:720px;max-height:80vh;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;border-bottom:1px solid var(--border);
  font-size:13px;font-weight:600;color:var(--text);
}
.modal-actions{display:flex;gap:8px}
.modal-actions button{
  padding:5px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:transparent;
  color:var(--text-2);cursor:pointer;font-size:12px;
  font-family:inherit;transition:.15s;font-weight:500;
  height:28px;display:inline-flex;align-items:center;
}
.modal-actions button:hover{border-color:var(--border-strong);color:var(--text);background:var(--surface-2)}
.modal-actions .btn-save{
  background:var(--brand);border-color:var(--brand);color:#fff;
}
.modal-actions .btn-save:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.modal-body{flex:1;display:flex;overflow:hidden;min-height:300px}
.modal-editor{
  flex:1;background:var(--surface);border:none;outline:none;
  padding:18px;color:var(--text);
  font-family:var(--font-mono);font-size:12px;
  resize:none;line-height:1.6;
}
.modal-input{
  width:100%;background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:9px 12px;color:var(--text);font-size:13px;
  outline:none;font-family:inherit;transition:.15s;
}
.modal-input:focus{border-color:var(--brand);background:var(--bg)}

/* ============ 附件卡片 ============ */
.att-card{
  display:flex;align-items:center;gap:8px;
  padding:6px 10px;margin-top:6px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--surface-2);cursor:pointer;transition:.15s;
  max-width:320px;
}
.att-card:hover{border-color:var(--brand);background:var(--surface-3)}
.att-icon{font-size:16px;line-height:1;flex-shrink:0}
.att-meta{min-width:0;flex:1}
.att-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-sub{font-size:10px;color:var(--text-4);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-badge{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--surface);color:var(--text-3);border:1px solid var(--border);flex-shrink:0}
.att-badge.no{color:var(--warn);background:var(--warn-soft);border-color:rgba(217,164,65,0.3)}
.att-dl{font-size:11px;color:var(--text-3);text-decoration:none;flex-shrink:0;padding:2px 4px;border-radius:4px}
.att-dl:hover{color:var(--brand);background:var(--brand-soft)}
.att-preview-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:14px}
.att-preview-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.att-preview-text{
  flex:1;width:100%;height:100%;overflow:auto;margin:0;
  padding:16px 18px;background:var(--bg);
  font-family:var(--font-mono);font-size:12px;line-height:1.6;
  color:var(--text-2);white-space:pre-wrap;word-break:break-word;
}
.att-nopreview{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:36px 20px;color:var(--text-3);font-size:12px;text-align:center;width:100%}
.att-nopreview .big{font-size:34px;opacity:.6}
.att-nopreview .size{font-size:11px;color:var(--text-4)}
.att-nopreview a{color:var(--brand);text-decoration:none;font-size:12px;border:1px solid var(--border);padding:6px 14px;border-radius:6px}
.att-nopreview a:hover{border-color:var(--brand);background:var(--brand-soft)}

/* ============ 经验背包：条目列表 ============ */
.exp-list{flex:1;overflow-y:auto;display:block;padding:14px 16px}
.exp-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;margin-bottom:8px;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-2);transition:border-color .2s;
}
.exp-item:hover{border-color:var(--border-strong)}
.exp-item-main{flex:1;min-width:0}
.exp-item-title{
  font-size:13px;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.exp-item-id{
  font-family:var(--font-mono);font-size:10px;color:var(--brand);
  background:var(--brand-soft);border-radius:4px;padding:1px 6px;
}
.exp-item-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.exp-item-tag{
  font-size:10px;color:var(--text-3);background:var(--surface);
  border:1px solid var(--border);border-radius:4px;padding:1px 6px;
}
.exp-item-summary{
  font-size:11.5px;color:var(--text-3);margin-top:5px;
  line-height:1.55;word-break:break-word;
}
.exp-item-count{
  font-family:var(--font-mono);font-size:10px;font-weight:600;
  color:var(--err);background:rgba(229,72,77,0.1);
  border:1px solid rgba(229,72,77,0.28);border-radius:4px;padding:1px 6px;
  white-space:nowrap;
}
.exp-item-fix{
  margin-top:6px;padding:6px 9px;border-radius:5px;
  background:var(--brand-soft);border:1px solid var(--border);
  font-size:11.5px;color:var(--text);line-height:1.55;word-break:break-word;
}
.exp-item-fix-label{
  display:block;font-size:10px;font-weight:600;color:var(--brand);
  margin-bottom:3px;
}
.exp-item-fix-text{color:var(--text-2)}
.exp-del{
  flex-shrink:0;background:transparent;border:1px solid rgba(229,72,77,0.3);
  color:var(--err);border-radius:5px;padding:3px 9px;cursor:pointer;
  font-size:11px;font-family:inherit;transition:.15s;
}
.exp-del:hover{background:rgba(229,72,77,0.12)}
.exp-empty{
  text-align:center;color:var(--text-3);font-size:12px;padding:40px 0;
}

/* ============ 底部状态栏（28px） ============ */
.footer-bar{
  display:flex;align-items:center;gap:8px;
  padding:0 12px;height:22px;
  background:var(--surface);
  border-top:1px solid var(--border);
  flex-shrink:0;font-size:9px;color:var(--text-3);
   line-height:1;
  overflow-x:auto;
  position:absolute;bottom:0;left:0;right:0;
  z-index:20;
}
/* 作用域分组：global（用户级/实例级） | session（会话级） */
.footer-bar .fb-group{
  display:inline-flex;align-items:center;gap:6px;
  padding:0 5px;border-radius:4px;transition:background .2s;
}
.footer-bar .fb-group[data-scope="session"]{background:var(--surface-2)}
.footer-bar .fb-items{display:inline-flex;align-items:center;gap:4px}
.footer-bar .fb-div{
  display:inline-block;width:1px;height:11px;flex-shrink:0;
  background:var(--border-strong);
}
@keyframes fbPulse{
  0%{background:var(--surface-2)}
  40%{background:var(--brand-soft)}
  100%{background:var(--surface-2)}
}
.footer-bar .fb-group.pulse{animation:fbPulse .5s ease-out}
.footer-bar .sep{color:var(--border-strong)}
.footer-bar .spacer{flex:1}
.footer-bar .dot{
  display:inline-block;width:5px;height:5px;
  border-radius:50%;margin-right:4px;
}
.footer-bar .dot.green{background:var(--ok)}
.footer-bar .dot.red{background:var(--err)}
.footer-bar #wsStatus .dot{margin-right:0}
/* webview 打开/最大化：状态条始终保持整条，webview 面板整体上移让出状态栏高度（见 .webview-panel 的 height） */
.footer-btn{
  background:transparent;border:1px solid var(--border);
  border-radius:4px;color:var(--text-2);
  cursor:pointer;font-size:10px;padding:0 7px;
  white-space:nowrap;transition:.15s;font-family:inherit;
  height:20px;display:inline-flex;align-items:center;gap:3px;
}
.footer-btn:hover{
  background:var(--surface-2);color:var(--text);
  border-color:var(--border-strong);
}
.footer-btn.icon-only{
  width:22px;padding:0;justify-content:center;font-size:12px;
}
.footer-btn.icon-only:hover{color:var(--text-2)}
.footer-btn.icon-only.letter{
  font-weight:700;font-size:11px;letter-spacing:.5px;
  color:var(--text-2);font-family:ui-monospace,Menlo,Consolas,monospace;
}
.footer-btn.icon-only.letter:hover{color:var(--brand);border-color:var(--brand)}

/* 活动高亮（E/T/H/A/S/M） */
.footer-btn.icon-only.letter.active{
  color:var(--brand);border-color:var(--brand);background:var(--brand-soft);
}
.footer-btn.icon-only.letter.active:hover{color:var(--brand-hover);border-color:var(--brand-hover)}
/* 活动详情气泡（hover 显示各模块实时状态） */
.footer-btn.icon-only.letter{position:relative}
.footer-btn.icon-only.letter::after{
  content:attr(data-activity-detail);
  position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
  background:var(--surface-3);color:var(--text);
  border:1px solid var(--border-strong);border-radius:4px;
  padding:4px 8px;font-size:10px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:.15s;z-index:3000;
  font-family:var(--font-sans);letter-spacing:0;font-weight:400;font-style:normal;
}
.footer-btn.icon-only.letter[data-activity-detail]:hover::after{opacity:1}
.footer-btn .fb-tag{
  font-weight:700;font-size:10px;letter-spacing:.5px;color:var(--text-2);
  font-family:ui-monospace,Menlo,Consolas,monospace;
}
.stat-sep{color:var(--text-4);margin:0 4px}

/* 面板底部留出状态栏高度 */
.panel{padding-bottom:22px}

/* ============ Toast ============ */
.toast{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
  background:var(--surface-3);color:var(--text);
  padding:8px 18px;border-radius:8px;font-size:12px;
  z-index:2000;transition:opacity .3s;
  border:1px solid var(--border-strong);
  pointer-events:none;
}
.toast.hide{opacity:0}

/* ============ 应用面板 ============ */
.app-panel-body{flex:1;overflow-y:auto;padding:40px 24px 16px;display:flex;flex-direction:column;align-items:center}
.app-section-title{
  font-size:13px;font-weight:600;color:var(--text-2);
  margin-bottom:14px;
  width:100%;max-width:var(--chat-width);
}
.app-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;width:100%;max-width:var(--chat-width);
}
.app-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 14px;text-align:center;cursor:pointer;
  transition:.18s;
}
.app-card:hover{
  border-color:var(--brand);
  background:var(--surface-2);
}
.app-card .icon{font-size:22px;margin-bottom:6px}
.app-card .name{font-size:12px;color:var(--text);font-weight:500}
.app-card .app-id{font-size:10px;color:var(--text-3);margin-top:2px;font-family:var(--font-mono);word-break:break-all}
.app-search-bar{width:100%;max-width:var(--chat-width);margin-bottom:10px}
.app-search-bar input{width:100%;box-sizing:border-box;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:12px;outline:none}
.app-search-bar input:focus{border-color:var(--brand)}
.app-search-bar input::placeholder{color:var(--text-3)}

.empty-state{
  color:var(--text-3);font-size:12px;
  text-align:center;padding:30px 0;
}
.loading{
  color:var(--text-3);font-size:12px;
  text-align:center;padding:20px 0;
}

.detail-block{
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:8px;padding:12px;
}
.detail-block-title{
  font-size:12px;font-weight:600;
  margin-bottom:8px;color:var(--text-2);
}
.detail-pre{
  background:var(--bg);border-radius:6px;
  padding:10px;font-size:11px;
  font-family:var(--font-mono);
  white-space:pre-wrap;word-break:break-all;
  max-height:40vh;overflow-y:auto;
  color:#A5D6FF;margin:0;line-height:1.55;
  border:1px solid var(--border);
}

#loadMoreTip{
  text-align:center;color:var(--text-4);
  font-size:11px;padding:8px;
}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,0.08);border-radius:8px;
}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}

/* ============ 移动端 ============ */
.side-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.6);z-index:19;
}
.side-overlay.show{display:block}
@media(max-width:768px){
  .sidebar{
    position:fixed;left:0;top:0;bottom:26px;
    width:280px;height:auto;
    transform:translateX(-100%);
    transition:transform .3s;
    box-shadow:4px 0 30px rgba(0,0,0,0.4);
    z-index:30;
  }
  /* 抽屉与遮罩停在状态栏上沿，保证 footer（含左侧）始终可见、不被压暗 */
  .side-overlay{inset:0 0 26px 0}
  .sidebar.open{transform:translateX(0)}
  .sidebar.collapsed{width:280px}
  .sidebar.collapsed .sidebar-search,
  .sidebar.collapsed .new-conv-btn,
  .sidebar.collapsed .conv-list,
  .sidebar.collapsed .footer-nav-btn .txt,
  .sidebar.collapsed .action-btn .txt{display:initial}
  .sidebar.collapsed .sidebar-footer{flex-direction:row;padding:6px}
  .sidebar.collapsed .footer-nav-btn{flex:1;width:auto;height:32px;font-size:11px;border-radius:6px;border-left:none}
  .sidebar.collapsed .sidebar-actions{flex-direction:row;padding:6px}
  .sidebar.collapsed .action-btn{flex:1;width:auto;height:26px;font-size:11px;border-radius:6px;border:1px solid var(--border)}
  .sidebar.collapsed .brand-name,
  .sidebar.collapsed .lang-toggle{display:flex}
  .sidebar.collapsed .sidebar-brand{flex-direction:row;padding:0 12px;height:48px}
  .sidebar.collapsed .collapse-btn{display:none}
  .messages{padding:36px 14px 12px}
  .msg{max-width:95%}
  .input-wrap{padding:0 14px 40px}
  .chat-title-float{padding:0 14px}
  .footer-bar{font-size:9px;gap:5px;padding:0 8px;height:26px}
  .footer-btn{padding:0 6px;font-size:9px;height:18px}
  .footer-btn.icon-only{width:24px;font-size:11px}
  .app-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .empty-title{font-size:16px}
  .webview-panel{display:none !important}
  .panel{padding-bottom:26px}
}

/* 主区顶部移动端悬浮菜单按钮 */
.mobile-menu-btn{
  display:none;
  position:absolute;top:8px;left:12px;z-index:10;
  width:32px;height:32px;border-radius:6px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text-3);cursor:pointer;
  align-items:center;justify-content:center;font-size:16px;
}
@media(max-width:768px){
  .mobile-menu-btn{display:inline-flex}
  .chat-title-float{padding-left:52px}
}
/* webview 最大化 */
.webview-panel.maximized {
  width: 100%;
  border-left: none;
}
.main.webview-max .panel {
  display: none !important;
}

/* 系统应用卡片 */
.sys-app-group{font-size:11px;letter-spacing:.08em;color:var(--text-4);margin:14px 4px 6px}
.sys-app-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:.15s}
.sys-app-card:hover{border-color:var(--brand);background:var(--surface-2)}
.sys-app-icon{font-size:20px;width:28px;text-align:center;color:var(--brand)}
.sys-app-info{min-width:0}
.sys-app-name{font-size:13px;font-weight:600;color:var(--text)}
.sys-app-desc{font-size:11px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<div class="side-overlay" id="sideOverlay" onclick="toggleSidebar()"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <a href="/" class="brand-mark" title="AICP Home">A</a>
    <span class="brand-name">AICP <span class="sub">BIO-1</span></span>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="zh">中</button>
      <button data-lang="en" class="active">EN</button>
    </div>
    <button class="collapse-btn" onclick="toggleSidebarDesktop()" title="Collapse">☰</button>
  </div>

  <div class="sidebar-search">
    <input type="text" id="convSearchInput" data-i18n-ph="sidebar.search" placeholder="Search conversations..." autocomplete="off" oninput="filterConversations(this.value)" onchange="filterConversations(this.value)">
    <script>
      // 搜索框每次页面加载强制清空：刷新即重置，无需保留上次搜索条件
      (function () {
        function _clearConvSearch() {
          var el = document.getElementById('convSearchInput');
          if (!el) return;
          if (el.value) { el.value = ''; }
          if (typeof filterConversations === 'function') { try { filterConversations(''); } catch (e) {} }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', _clearConvSearch);
        } else {
          _clearConvSearch();
        }
        // 浏览器自动填充可能发生在 DOMContentLoaded 之后，再兜一次
        window.addEventListener('load', _clearConvSearch);
        setTimeout(_clearConvSearch, 300);
      })();

      // 上报 console 页面已打开 -> 启动时不再重复弹浏览器
      (function () {
        function _mark(action) {
          try {
            fetch('/api/os/_local_browser_launcher', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: action, url: location.href })
            }).catch(function () {});
          } catch (e) {}
        }
        function _markConnected() { _mark('mark_connected'); }
        function _markDisconnected() { _mark('mark_disconnected'); }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', _markConnected);
        } else {
          _markConnected();
        }
        window.addEventListener('load', _markConnected);
        window.addEventListener('beforeunload', _markDisconnected);
        window.addEventListener('pagehide', _markDisconnected);
      })();
    </script>
  </div>
  <button class="new-conv-btn" onclick="createNewConversation()"><span data-i18n="sidebar.new">+ New chat</span></button>
  <div class="conv-list" id="convList">
    <div class="empty-state" data-i18n="common.loading">Loading...</div>
  </div>

  <div class="sidebar-footer">
    <button class="footer-nav-btn active" data-panel="chat" onclick="switchPanel('chat')" title="Chat">💬<span class="txt" data-i18n="sidebar.chat">Chat</span></button>
    <button class="footer-nav-btn" data-panel="apps" onclick="switchPanel('apps')" title="Apps">📦<span class="txt" data-i18n="sidebar.apps">Apps</span></button>
    <button class="footer-nav-btn" onclick="openSystemApps()" title="System">⚙️<span class="txt" data-i18n="sidebar.system">System</span></button>
  </div>

  <div class="sidebar-actions">
    <button class="action-btn" onclick="restartSystem()" title="Restart">↻<span class="txt" data-i18n="nav.restart">Restart</span></button>
    <button class="action-btn" onclick="logout()" title="Logout">⏻<span class="txt" data-i18n="nav.logout">Logout</span></button>
  </div>
</div>

<div class="main">
  <div class="panel active" id="panel-chat">
    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="chat-title-float" id="chatTitleFloat">
      <div class="title-text"><span id="chatTitle" data-i18n="chat.new">New chat</span><span class="rename-hint" onclick="renameCurrentConversation()" title="Rename">✏</span></div>
    </div>
    <button class="webview-toggle-btn" id="webviewToggleBtn" onclick="toggleWebviewFromCorner()" title="Toggle Preview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
    <div class="messages" id="chatMessages">
      <div class="empty-chat">

var _lang = localStorage.getItem('aicp_lang') || 'en';
function t(key){ return (I18N[_lang] && I18N[_lang][key]) || key; }

function applyLang(lang){
  _lang = lang;
  localStorage.setItem('aicp_lang', lang);
  document.documentElement.lang = (lang === 'zh' ? 'zh-CN' : 'en');
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k = el.getAttribute('data-i18n');
    var v = I18N[lang] && I18N[lang][k];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
    var k = el.getAttribute('data-i18n-ph');
    var v = I18N[lang] && I18N[lang][k];
    if (v !== undefined) el.placeholder = v;
  });
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){
    var k = el.getAttribute('data-i18n-title');
    var v = I18N[lang] && I18N[lang][k];
    if (v !== undefined) el.title = v;
  });
  document.querySelectorAll('#langToggle button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-lang') === lang);
  });
  if (typeof renderConversationList === 'function' && typeof conversations !== 'undefined') {
    renderConversationList();   // 走 conversationsFiltered，切语种不丢过滤结果

// ============ 工具函数 ============
function getToken() {
    var m = document.cookie.match(/aicp_token=([^;]+)/);
    if (m) return m[1];
    return localStorage.getItem('aicp_token') || '';
}
function getSource() {
    var h = location.hostname;
    return (h === 'localhost' || h === '127.0.0.1') ? 'local' : 'remote';
}
function escapeHtml(t) {
    if (t == null) return '';
    var d = document.createElement('div');
    d.textContent = String(t);
    return d.innerHTML;
}
function renderMarkdown(content) {
    if (content == null) return '';
    var text = String(content);
    if (typeof marked !== 'undefined') {
        var html = marked.parse(text, {breaks:true, gfm:true, headerIds:false});
        if (typeof DOMPurify !== 'undefined') {
            return DOMPurify.sanitize(html, {ADD_ATTR:['target']});
        }
        return html;
    }
    return escapeHtml(text).replace(/\n/g,'<br>');
}
function showToast(msg) {
    var t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.remove('hide');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.add('hide'); }, 3000);
}
function formatTime(ts) {
    if (!ts) return '';
    try { return new Date(ts).toLocaleTimeString(_lang === 'zh' ? 'zh-CN' : 'en-US',{hour12:false}); } catch(e){ return ''; }
}
function formatConvTime(ts) {
    try {
        var d = new Date(ts);
        var now = new Date();
        var sameDay = d.toDateString() === now.toDateString();
        var yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
        var isYesterday = d.toDateString() === yesterday.toDateString();
        if (_lang === 'zh') {
            if (sameDay) return d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit', hour12: false});
            if (isYesterday) return '昨天 ' + d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit', hour12: false});
            return d.toLocaleDateString('zh-CN', {month: '2-digit', day: '2-digit'}) + ' ' + d.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit', hour12: false});
        } else {
            if (sameDay) return d.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', hour12: false});
            if (isYesterday) return 'Yesterday ' + d.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', hour12: false});
            return d.toLocaleDateString('en-US', {month: 'short', day: 'numeric'}) + ' ' + d.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', hour12: false});
        }
    } catch(e) { return ''; }
}
function shortTarget(target) {
    if (!target) return '?';
    var parts = target.split('/');
    if (parts.length <= 2) return target;
    return parts.slice(-2).join('/');
}
function apiFetch(url, body) {
    var headers = {'Content-Type':'application/json'};
    var token = getToken();
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, {method:'POST', headers:headers, body: JSON.stringify(body)});
}

function isSameOriginUrl(url) {
    try { var u = new URL(url, location.href); return u.origin === location.origin; }
    catch(e) { return false; }
}
function openWebview(url, title) {
    if (!url) return;
    var panel = document.getElementById('webviewPanel');
    var frame = document.getElementById('webviewFrame');
    var titleEl = document.getElementById('webviewTitle');
    if (!isSidebarCollapsed()) {
        var sb = document.getElementById('sidebar');
        if (sb) { sb.classList.add('collapsed'); _webviewOpenedSidebarCollapsed = true; }
    } else { _webviewOpenedSidebarCollapsed = false; }
    frame.src = url;
    titleEl.textContent = title || url;
    panel.classList.add('show');
    // webview 面板整体上移让出底部状态栏高度（见 .webview-panel 的 height），状态条保持整条
    panel.dataset.url = url;
    panel.dataset.title = title || url;
    // 打开后右上角按钮隐藏
    var btn = document.getElementById('webviewToggleBtn');
    if (btn) btn.classList.add('hidden');
    // 记录最后打开的页面，供右上角按钮恢复
    panel.dataset.lastUrl = url;
    panel.dataset.lastTitle = title || url;

// 右上角按钮：拉出 webview；有历史记录则恢复最后一次打开的页面，无记录则空白面板

async function loadConversations() {
    var box = document.getElementById('convList');
    var now = Date.now();
    var lastId = localStorage.getItem('aicp_last_conversation');
    if (_convListCache.list.length > 0 && (now - _convListCache.ts) < CACHE_TTL) {
        conversations = _convListCache.list;
        conversationsFiltered = conversations;
        renderConversationList(conversations);
        var target = conversations.find(function(c){ return c.id === lastId; }) || conversations[0];
        if (target) { selectConversation(target.id); } else { await createNewConversation(); return; }
        refreshConversations(true);
        return;
    }
    box.innerHTML = '<div class="empty-state">' + t('common.loading') + '</div>';
    await refreshConversations(false);
}

async function refreshConversations(silent) {
    var box = document.getElementById('convList');
    try {
        var res = await apiFetch('/api/builtins/agents/main_agent', {action:'list_conversations', include_archived: true});
        var data = await res.json();
        if (!data.ok) {
            if (box) box.innerHTML = '<div class="empty-state">' + t('msg.loadFail') + escapeHtml(data.error || '?') + '</div>';
            return;
        }
        conversations = data.conversations || [];
        // 服务端返回的分身集合：本地缓存里服务端已不存在的分身（已删除/已清理）要同步剔除，
        // 并且不得再被重新合并回去（旧逻辑会把已删除的分身 push 回来，导致前端不消失）
        var serverSubIds = {};
        conversations.forEach(function(c){ if (c && c.id && c.id.indexOf('sub_') === 0) serverSubIds[c.id] = 1; });
        Object.keys(subSessions).forEach(function(sid) {
            if (!serverSubIds[sid]) { delete subSessions[sid]; delete subSessionBuffers[sid]; }
        });
        Object.keys(subSessions).forEach(function(sid) {
            var exists = conversations.some(function(c){ return c.id === sid; });
            if (exists) {
                var idx = conversations.findIndex(function(c){ return c.id === sid; });
                if (idx >= 0 && subSessions[sid].status) conversations[idx].status = subSessions[sid].status;
            }
        });
        conversations = conversations.filter(function(c) {
            if (c.id.startsWith('sub_')) return !c._deleted;
            return true;
        });
        conversationsFiltered = conversations;
        _convListCache = { list: conversations, ts: Date.now() };
        // 保持当前搜索过滤：刷新后若搜索框有值，重新过滤再渲染
        var _q = (document.getElementById('convSearchInput') || {}).value || '';
        if (_q.trim()) {
            filterConversations(_q);
        } else {
            renderConversationList(conversations);
        }
        if (silent) return;
        var lastId = localStorage.getItem('aicp_last_conversation');
        var target = conversations.find(function(c){ return c.id === lastId; }) || conversations[0];
        if (target) { selectConversation(target.id); } else { await createNewConversation(); }
    } catch(e) {
        console.error('refreshConversations:', e);
        if (box) box.innerHTML = '<option>' + escapeHtml(t('msg.loadFail') + ' ' + e.message) + '</option>';
    }
}

// ============ 会话排序：分身挂到「发起它的对话」下面 ============
function orderConversations(list) {
    var arr = (list || []).slice();
    var isSub = function(c){ return c && c.id && c.id.indexOf('sub_') === 0; };
    var normals = arr.filter(function(c){ return !isSub(c); });
    var subs = arr.filter(function(c){ return isSub(c); });
    normals.sort(function(a, b){ return (b.updated_at || '').localeCompare(a.updated_at || ''); });
    var byParent = {};
    subs.forEach(function(s){
        var p = s.parent_session || '';
        if (!byParent[p]) byParent[p] = [];
        byParent[p].push(s);
    });
    Object.keys(byParent).forEach(function(p){
        byParent[p].sort(function(a, b){
            var ta = a.created_at || a.updated_at || '';
            var tb = b.created_at || b.updated_at || '';
            return ta.localeCompare(tb);
        });
    });
    var out = [];
    var placed = {};
    normals.forEach(function(c){
        out.push(c);
        (byParent[c.id] || []).forEach(function(s){ out.push(s); placed[s.id] = 1; });
    });
    subs.forEach(function(s){ if (!placed[s.id]) out.push(s); });
    return out;
}

function renderConversationList(list) {
    // 调用方不传 list 时，用「当前过滤结果」而不是全量——
    // 否则过滤后点选中 / 切语种会把列表恢复成全量
    if (!list) {
        list = (conversationsFiltered && conversationsFiltered.length >= 0)
            ? conversationsFiltered
            : conversations;
    }
    var sorted = orderConversations(list);
    list = sorted;
    var box = document.getElementById('convList');
    if (!list || list.length === 0) {
        box.innerHTML = '<div class="empty-state">' + t('msg.noConversations') + '</div>';
        return;
    }
    var html = '';
    list.forEach(function(c) {
        var active = (c.id === currentConversationId) ? ' active' : '';
        var isSub = c.is_sub || c.id.startsWith('sub_');
        var isArchived = c.archived;
        var title = c.title || t('msg.untitled');
        var preview = c.last_preview || '';
        var meta = '';
        if (c.updated_at) meta += formatConvTime(c.updated_at);
        if (c.message_count) meta += ' · ' + c.message_count;
        if (isSub) {
            var icon = {running: '⏳', done: '✅', failed: '❌'}[c.status] || '🤖';
            meta = icon + (meta ? ' · ' + meta : '');
        }
        var archivedClass = isArchived ? ' conv-archived' : '';
        var lockIcon = isArchived ? '<span class="conv-lock" title="' + t('msg.archived') + '">🔒</span>' : '';
        html += '<div class="conv-item' + active + (isSub ? ' conv-sub' : '') + archivedClass + '" data-id="' + escapeHtml(c.id) + '" onclick="selectConversation(\'' + escapeHtml(c.id) + '\')">';
        html += '  <span class="conv-del" onclick="event.stopPropagation();deleteConversation(\'' + escapeHtml(c.id) + '\')">✕</span>';
        html += '  <div class="conv-title">' + (isSub ? '🤖 ' : '') + escapeHtml(title) + lockIcon + '</div>';
        if (preview) html += '  <div class="conv-preview">' + escapeHtml(preview) + '</div>';
        if (meta) html += '  <div class="conv-meta">' + escapeHtml(meta) + '</div>';
        html += '</div>';
    });
    box.innerHTML = html;
}

function filterConversations(q) {
    q = (q || '').toLowerCase().trim();
    if (!q) {
        conversationsFiltered = conversations;
        renderConversationList(conversations);
        return;
    }
    var f = conversations.filter(function(c){
        return (c.title||'').toLowerCase().indexOf(q) >= 0 || (c.last_preview||'').toLowerCase().indexOf(q) >= 0;
    });
    conversationsFiltered = f;
    renderConversationList(f);

    // ★ 搜索后自动对齐聊天区：有结果选第一个，无结果清空聊天区。
    //   只动聊天区，不动搜索框（否则用户要重新点，容易发错对象）。
    if (f.length > 0) {
        var firstId = f[0].id;
        if (currentConversationId !== firstId) {
            selectConversation(firstId);
        }
    } else {
        _clearChatAreaForEmptySearch();
    }
}

// 搜不到时的聊天区清空（只清消息区 + 标题，不动搜索框、不动侧栏过滤态）
function _clearChatAreaForEmptySearch() {
    currentConversationId = null;
    currentTurn = null;
    toolNodes = {};
    thinkingLine = null;
    var msgs = document.getElementById('chatMessages');
    if (msgs) {
        msgs.innerHTML = '<div class="empty-chat"><div class="empty-mark">A</div><div class="empty-desc">' + (_lang === 'zh' ? '没有匹配的对话' : 'No matching conversations') + '</div></div>';
        msgs.dataset.oldestTs = '';
        msgs.dataset.hasMore = '0';
    }
    var titleEl = document.getElementById('chatTitle');
    if (titleEl) titleEl.textContent = t('chat.new');
    var sessEl = document.getElementById('sessionDisplay');
    if (sessEl) sessEl.textContent = (t('footer.session').split(':')[0]) + ': -';
    // 作废旧回合状态，避免残留「运行中」按钮态
    _turnEpoch++;
    _turnRunningConfirmed = false;
    applyTurnState(false);
}

async function createNewConversation() {
    try {
        var res = await apiFetch('/api/builtins/agents/main_agent', {action:'new_conversation'});
        var data = await res.json();
        if (data.ok) {
            currentConversationId = data.conversation_id;

}

function prependFlowAsTurns(flow) {
    var msgs = document.getElementById('chatMessages');
    var inner = msgs.querySelector('.messages-inner') || msgs;
    var oldScrollHeight = msgs.scrollHeight;
    var oldScrollTop = msgs.scrollTop;
    var turns = [];
    var current = null;
    flow.forEach(function(e) {
        if (e.from === 'user') { current = { user: e, items: [] }; turns.push(current); }
        else if (current) { current.items.push(e); }
    });
    if (turns.length === 0) return;
    var frag = document.createDocumentFragment();
    turns.forEach(function(t) {
        var node = buildTurnNode(t);
        if (node) frag.appendChild(node);
    });
    if (inner.firstChild) inner.insertBefore(frag, inner.firstChild);
    else inner.appendChild(frag);
    msgs.scrollTop = oldScrollTop + (msgs.scrollHeight - oldScrollHeight);
}

async function loadConversationFlow(id, beforeTs) {
    var msgs = document.getElementById('chatMessages');
    var isLoadMore = !!beforeTs;
    if (!isLoadMore) {
        msgs.innerHTML = '<div class="empty-chat"><div class="empty-mark">A</div><div class="empty-desc">' + t('common.loading') + '</div></div>';
        msgs.dataset.oldestTs = '';
        msgs.dataset.hasMore = '0';
        currentTurn = null;
        toolNodes = {};
        thinkingLine = null;
    }
    try {
        var body = { action: 'get_session', session_id: id, limit: 10 };
        if (beforeTs) body.before_ts = beforeTs;
        var res = await apiFetch('/api/builtins/agents/main_agent', body);
        var data = await res.json();
        if (!data.ok || !data.flow) {
            if (!isLoadMore) {
                msgs.innerHTML = '<div class="empty-chat"><div class="empty-desc">' + t('msg.loadFail') + escapeHtml(data.error || '?') + '</div></div>';
            }
            return;
        }
        if (data.flow.length === 0) {
            if (!isLoadMore) {
                msgs.innerHTML = '<div class="empty-chat"><div class="empty-mark">A</div><div class="empty-title">AICP BIO-1</div><div class="empty-desc">' + t('chat.emptyDesc') + '</div></div>';
            }
            msgs.dataset.hasMore = '0';
            return;
        }
        sessionCache[id] = { flow: data.flow, ts: Date.now() };
        if (isLoadMore) {
            prependFlowAsTurns(data.flow);
            if (data.has_more) {
                msgs.dataset.oldestTs = data.oldest_ts || '';
                msgs.dataset.hasMore = '1';
            } else { msgs.dataset.hasMore = '0'; }
        } else {
            renderFlowAsTurns(data.flow);
            if (data.has_more) {
                msgs.dataset.oldestTs = data.oldest_ts || '';
                msgs.dataset.hasMore = '1';
                var inner = msgs.querySelector('.messages-inner');
                if (inner) {
                    inner.insertAdjacentHTML('afterbegin', '<div id="loadMoreTip">↑ ' + (_lang === 'zh' ? '往上滚动加载更早的记录（共 ' + (data.round_count || '?') + ' 轮）' : 'Scroll up to load earlier (' + (data.round_count || '?') + ' rounds)') + '</div>');
                }
            } else { msgs.dataset.hasMore = '0'; }
            msgs.scrollTop = msgs.scrollHeight;
        }
    } catch (e) {
        if (!isLoadMore) {
            msgs.innerHTML = '<div class="empty-chat"><div class="empty-desc">' + t('msg.loadFail') + escapeHtml(e.message) + '</div></div>';
        } else { msgs.dataset.hasMore = '1'; }
    }
}

function buildTurnNode(turnData) {
    if (!turnData || !turnData.user) return null;
    var turn = document.createElement('div');
    turn.className = 'turn';
    var div = document.createElement('div');
    div.className = 'msg user';
    var _att = parseAttachments(turnData.user.content || '');
    var _body = (_att.text ? '<div>' + escapeHtml(_att.text) + '</div>' : '') + renderAttachmentCards(_att.files);
    div.innerHTML = '<div class="bubble">' + _body + '</div><div class="time">' + (_lang === 'zh' ? '我 · ' : 'Me · ') + formatTime(turnData.user.timestamp) + '</div>';
    turn.appendChild(div);
    bindAttCardClicks(turn);
    var chain = document.createElement('div');
    chain.className = 'tool-chain';
    var hasChain = false;
    var toolMap = {};
    var lastThink = '';
    turnData.items.forEach(function(e) {
        if (e.from === 'ai' && e.think) lastThink = e.think;
        if (e.from === 'ai' && e.call === 'reply' && e.content) {
            var a = document.createElement('div');
            a.className = 'msg assistant';
            a.innerHTML = '<div class="bubble">' + renderMarkdown(e.content) + '</div><div class="time">' + (_lang === 'zh' ? '系统 · ' : 'AI · ') + formatTime(e.timestamp) + '</div>';
            turn.appendChild(a);
        }
        if (e.from === 'system' && e.action === 'call_start') {
            hasChain = true;
            var d = e.detail || {};
            var node = document.createElement('div');
            node.className = 'tool-node ok';
            node.dataset.callId = d.call_id || '';
            node.onclick = function() { showCallDetail(d.call_id); };
            var thinkFull = lastThink || '';
            var params = d.params || d.args || {};
            var argsJson = '';
            try { argsJson = JSON.stringify(params, null, 2); } catch(e) { argsJson = ''; }
            node.title = toolTitle(d.target, d.action || '', argsJson, thinkFull);
            node.innerHTML =
                '<div class="tool-think">' + escapeHtml(thinkFull.slice(0, 40)) + '</div>' +
                '<div class="tool-name-row">' +
                    '<span class="tool-name">' + escapeHtml(shortTarget(d.target)) + '</span>' +
                    '<span class="dur"></span>' +
                '</div>' +
                (d.action ? '<div class="tool-action">[' + escapeHtml(d.action) + ']</div>' : '');
            toolMap[d.call_id] = node;
            lastThink = '';
            if (chain.children.length > 0) {
                var arrow = document.createElement('span');
                arrow.className = 'tool-arrow';
                arrow.textContent = '→';
                chain.appendChild(arrow);
            }
            chain.appendChild(node);
        }
        if (e.from === 'system' && e.action === 'call_end') {
            var d2 = e.detail || {};
            if (toolMap[d2.call_id]) {
                var dur = toolMap[d2.call_id].querySelector('.dur');
                if (dur && d2.duration_ms != null) dur.textContent = (d2.duration_ms / 1000).toFixed(1) + 's';
            }
        }
        if (e.from === 'system' && e.action === 'call_error') {
            var d3 = e.detail || {};
            if (toolMap[d3.call_id]) {
                toolMap[d3.call_id].classList.remove('ok');
                toolMap[d3.call_id].classList.add('error');
            }
        }
    });
    if (hasChain) turn.insertBefore(chain, turn.children[1] || null);
    return turn;
}

// ============ 附件：结构化解析 / 卡片渲染 / 预览 ============
// 后端传来的 <attachments> 块形如：
//   <attachments>
//   {"name":"a.png","path":"E:\\...\\a.png","url":"/data/uploads/xx/a.png","size":1234}
//   </attachments>
// 前端剥离该块，改渲染成附件小卡片（用户看不到路径，但主控拿得到）。
var ATT_IMG = ['png','jpg','jpeg','gif','webp','bmp','svg','ico','avif'];
var ATT_TEXT = ['txt','md','markdown','csv','json','yaml','yml','xml','html','htm','css','js','jsx','ts','tsx','py','java','c','cpp','h','hpp','go','rs','rb','php','sh','bash','zsh','sql','ini','cfg','conf','toml','log','tsv','srt','vtt'];
var ATT_VIDEO = ['mp4','webm','mov','m4v','ogv','ogg','avi','mkv','flv','wmv','mpeg','mpg','3gp','ts'];
var ATT_AUDIO = ['mp3','wav','m4a','aac','flac','oga','opus','wma','aiff','aif','amr'];
var ATT_NO_PREVIEW = ['pdf','doc','docx','xls','xlsx','ppt','pptx','zip','rar','7z','gz','tar','exe','dll','so','dmg','iso'];

function attExt(name) {
    var n = String(name || '').toLowerCase();
    var i = n.lastIndexOf('.');
    return i >= 0 ? n.slice(i + 1) : '';
}
function attSizeText(sz) {
    sz = Number(sz || 0);
    if (!sz) return '';
    if (sz < 1024) return sz + ' B';
    if (sz < 1024 * 1024) return (sz / 1024).toFixed(1) + ' KB';
    return (sz / 1024 / 1024).toFixed(2) + ' MB';
}
function attKind(name) {
    var e = attExt(name);
    if (ATT_IMG.indexOf(e) >= 0) return 'image';
    if (ATT_TEXT.indexOf(e) >= 0) return 'text';
    if (ATT_VIDEO.indexOf(e) >= 0) return 'video';
    if (ATT_AUDIO.indexOf(e) >= 0) return 'audio';
    return 'binary';
}
function attIcon(kind) {
    if (kind === 'image') return '🖼';
    if (kind === 'text') return '📄';
    if (kind === 'video') return '🎬';
    if (kind === 'audio') return '🎵';
    return '📦';
}
function attKindLabel(kind) {
    if (kind === 'image') return '图片';
    if (kind === 'text') return '文本';
    if (kind === 'video') return '视频';
    if (kind === 'audio') return '音频';
    return '无法预览';
}

// 从消息文本中解析 <attachments> 块，返回 {text, files}
function parseAttachments(content) {
    var src = String(content == null ? '' : content);
    var files = [];
    var m = src.match(/<attachments>([\s\S]*?)<\/attachments>/);
    if (m) {
        m[1].split('\n').forEach(function(line) {
            line = line.trim();
            if (!line) return;
            try {
                var o = JSON.parse(line);
                if (o && o.name) files.push(o);
            } catch(e) { /* 非法行忽略 */ }
        });
        src = src.replace(/<attachments>[\s\S]*?<\/attachments>/g, '');
    }
    return {text: src.replace(/\n{3,}/g, '\n\n').trim(), files: files};
}

// 渲染附件小卡片（整卡可点；文件信息以 data-* 属性直传，避免 JSON 内联转义问题）
function renderAttachmentCards(files) {
    if (!files || !files.length) return '';
    var html = '';
    files.forEach(function(f, i) {
        var kind = attKind(f.name);
        var sz = attSizeText(f.size);
        var sub;
        if (kind === 'binary') {
            sub = (sz || '大小未知') + ' · ' + attKindLabel(kind);
        } else {
            sub = sz;
        }
        var badge = kind === 'binary' ? '<span class="att-badge no">' + attKindLabel(kind) + '</span>' : '<span class="att-badge">' + attKindLabel(kind) + '</span>';
        var dl = f.url ? '<a class="att-dl" href="' + escapeHtml(f.url) + '" download title="下载" onclick="event.stopPropagation();">⬇</a>' : '';
        html += '<div class="att-card" data-att="' + i + '"'
              + ' data-att-name="' + escapeHtml(f.name || '') + '"'
              + ' data-att-url="' + escapeHtml(f.url || '') + '"'
              + ' data-att-size="' + escapeHtml(String(f.size || 0)) + '"'
              + ' title="点击预览">'
              + '<span class="att-icon">' + attIcon(kind) + '</span>'
              + '<span class="att-meta"><span class="att-name">' + escapeHtml(f.name) + '</span><span class="att-sub">' + escapeHtml(sub) + '</span></span>'
              + badge + dl + '</div>';
    });
    return html;
}

// 附件预览：在右侧 webview 面板打开独立预览页（同域，iframe 加载）
// 只编码 URL 的 path 部分，保留 query
function attEncUrl(u) {
    if (!u) return '';
    var q = u.indexOf('?');
    if (q < 0) return encodeURI(u);
    return encodeURI(u.slice(0, q)) + u.slice(q);
}
// 组装预览页 URL：?f=<urlencoded JSON>
function attPreviewUrl(f) {
    return '/tools/att-preview.html?f=' + encodeURIComponent(JSON.stringify({
        name: f.name || '', url: f.url || '', size: f.size || 0
    }));
}
// 在右侧 webview 面板打开附件预览
function openAttPreviewInWebview(f) {
    if (!f || !f.url) return;
    var url = attPreviewUrl(f);
    if (typeof openWebview === 'function') {
        openWebview(url, f.name || '附件预览');
    } else {
        window.open(url, '_blank', 'noopener');
    }
}
// 事件委托：点击 .att-card[data-att] 打开预览
function bindAttCardClicks(scope) {
    var root = scope || document;
    var cards = root.querySelectorAll('.att-card[data-att]');
    for (var i = 0; i < cards.length; i++) {
        (function(card){
            if (card.__attBound) return;
            card.__attBound = true;
            card.addEventListener('click', function(ev){
                // 下载按钮单独处理
                if (ev.target && ev.target.closest && ev.target.closest('.att-dl')) return;
                var f = {
                    name: card.getAttribute('data-att-name') || '',
                    url: card.getAttribute('data-att-url') || '',
                    size: Number(card.getAttribute('data-att-size') || 0)
                };
                if (!f.url) return;
                openAttPreviewInWebview(f);
            });
        })(cards[i]);
    }
}

var _scrollPending = false;
var _stickToBottom = true;   // 用户上翻历史时不再强制拉回底部
// 统一置底：rAF 合并，避免 thinking 行插入/增长后被底部裁掉
function scrollToBottom() {
    var msgs = document.getElementById('chatMessages');
    if (!msgs) return;
    if (!_stickToBottom) return;
    if (_scrollPending) return;
    _scrollPending = true;
    requestAnimationFrame(function() {
        msgs.scrollTop = msgs.scrollHeight;
        // 第二帧再兜一次：thinking 行/工具节点刚插入时高度可能还没稳定
        requestAnimationFrame(function() {
            msgs.scrollTop = msgs.scrollHeight;
            _scrollPending = false;
        });
    });
}

// 断线重连后补拉：服务端 flow 是权威（内存态实时更新），本地 DOM 条目少于服务端时重渲染当前会话
async function resyncCurrentConversation() {
    if (!currentConversationId) return;
    try {
        var res = await apiFetch('/api/builtins/agents/main_agent', {action:'get_session', session_id: currentConversationId, limit: 50});
        var data = await res.json();
        if (!data.ok || !data.flow) return;
        var flow = data.flow || [];
        var serverCount = 0;
        flow.forEach(function(e){
            if (e.from === 'user') serverCount++;
            else if (e.from === 'ai' && e.call === 'reply' && e.content) serverCount++;
        });
        var msgs = document.getElementById('chatMessages');
        if (!msgs) return;
        var localCount = msgs.querySelectorAll('.msg.user').length + msgs.querySelectorAll('.msg.assistant').length;
        if (serverCount <= localCount) return;
        renderFlowAsTurns(flow);
        scrollToBottom();
    } catch(e) { console.warn('resync failed:', e); }
}

function initAutoScroll() {
    var msgs = document.getElementById('chatMessages');
    if (!msgs || msgs.__autoScrollBound) return;
    msgs.__autoScrollBound = true;
    var mo = new MutationObserver(function(){ scrollToBottom(); });
    mo.observe(msgs, { childList: true, subtree: true, characterData: true });
    msgs.addEventListener('scroll', function(){
        _stickToBottom = (msgs.scrollTop + msgs.clientHeight) >= (msgs.scrollHeight - 48);
    });
}

function ensureThinkingLine() {
    if (!currentTurn) return null;
    if (thinkingLine && thinkingLine.parentNode) return thinkingLine;
    thinkingLine = null;
    var chain = getOrCreateToolChain();

    thinkingLine.dataset.full = '';

}
function updateThinkingLine(chunk) {
    var line = ensureThinkingLine();
    if (!line) return;
    var full = (line.dataset.full || '') + chunk;
    line.dataset.full = full;
    line.textContent = '💭 ' + (full.length > 80 ? '...' + full.slice(-80) : full);
    try {
        var m = chunk.match(/🧩\s*(\{[\s\S]*\})/);
        if (m) { var obj = JSON.parse(m[1]); if (obj && obj.think) _lastThink = obj.think; }
    } catch(e) {}
}
function removeThinkingLine() {
    if (thinkingLine) {
        thinkingLine.style.opacity = '0';
        var toRemove = thinkingLine;
        setTimeout(function(){ if (toRemove.parentNode) toRemove.remove(); }, 300);
        thinkingLine = null;
    }
}
function fmtArgsLines(params) {
    var out = [];
    try {
        if (!params || typeof params !== 'object') return '';
        var keys = Object.keys(params);
        for (var i = 0; i < keys.length; i++) {
            var k = keys[i], v = params[k];
            var sv;
            try { sv = (typeof v === 'string') ? v : JSON.stringify(v); } catch(e) { sv = String(v); }
            if (sv === undefined) sv = '';
            sv = String(sv).replace(/\n/g, ' ⏎ ');
            out.push('<div class="arg-row"><span class="k">' + escapeHtml(k) + '</span>: <span class="v">' + escapeHtml(sv) + '</span></div>');
        }
    } catch(e) {}
    return out.join('');
}
function toolTitle(target, action, argsJson, think) {
    var lines = [];
    if (think) lines.push(think);
    lines.push('');
    var t = target || '';
    if (t && t.indexOf('/') < 0) {
        t = 'builtins/tools/' + t;
    }
    var head = '▸ ' + t;
    if (action) head += '  [' + action + ']';
    lines.push(head);
    if (argsJson) {
        try {
            var o = JSON.parse(argsJson);
            var ks = Object.keys(o || {});
            for (var i = 0; i < ks.length; i++) {
                var v = o[ks[i]], sv;
                try { sv = (typeof v === 'string') ? v : JSON.stringify(v); } catch(e) { sv = String(v); }
                if (sv === undefined) sv = '';
                lines.push('  ' + ks[i] + ': ' + String(sv).replace(/\n/g, ' ⏎ '));
            }
        } catch(e) { lines.push(argsJson); }
    }
    return lines.join('\n');
}
function handleToolStart(data) {
    var d = data.detail || {};

    var think = data.think || d.think || d.result || _lastThink || '';
    var line = ensureThinkingLine();

    var node = document.createElement('div');
    node.className = 'tool-node running';
    node.dataset.callId = data.call_id;

    node.innerHTML =
        '<div class="tool-think">' + escapeHtml(think.slice(0, 40)) + '</div>' +

            '<span class="dur"></span>' +

    if (chain.children.length > 0) {

}
function handleToolEnd(data) {

function handleReplyEnd(data) {

    removeThinkingLine();

// ============ 活动状态（E/T/H/A/S/M 高亮，按作用域分组） ============
// user 级：E          session 级：T / A / S
// system 级（实例共享）：H / M  → 与 user 级同放"全局区"
var _activityRetry = 0;
var _activityTimer = null;
var _activityScopeI18n = { user: 'footer.scopeUser', session: 'footer.scopeSession', system: 'footer.scopeSystem' };
function activityGroup(scope){ return scope === 'session' ? 'session' : 'global'; }
function activityScopeLabel(scope){ return t(_activityScopeI18n[scope] || 'footer.scopeUser'); }
function applyActivity(modules, groupFilter) {
    if (!modules) return;
    var globalBox = document.getElementById('fbGlobalItems');
    var sessionBox = document.getElementById('fbSessionItems');
    document.querySelectorAll('.footer-btn.icon-only.letter[data-activity]').forEach(function(el){
        var k = el.getAttribute('data-activity');
        var m = modules[k];
        if (!m) return;
        var scope = m.scope || 'user';
        var group = activityGroup(scope);
        // 按后端返回的 scope 归位 —— 前端不需要知道字母含义
        var box = (group === 'session') ? sessionBox : globalBox;
        if (box && el.parentNode !== box) box.appendChild(el);
        if (groupFilter && group !== groupFilter) return;  // 只刷新指定作用域，另一组保持不动
        el.classList.toggle('active', !!m.active);
        if (m.detail) el.setAttribute('data-activity-detail', activityScopeLabel(scope) + ' · ' + m.detail);
        else el.removeAttribute('data-activity-detail');
    });
}
async function refreshActivity(groupFilter) {
    try {
        var ctl = new AbortController();
        var to = setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, 6000);
        // ★ 必须带 session_id：task / sub / skill 都是会话级，没传就永远 active=false
        var res = await apiFetch('/api/builtins/tools/activity_status', {
            payload: { action: 'snapshot', user_id: _userId },
            meta: { session_id: currentConversationId }
        });
        clearTimeout(to);
        if (!res || !res.ok) return;
        var data = await res.json();
        if (!data || !data.ok) return;
        _activityRetry = 0;
        applyActivity(data.data && data.data.modules, groupFilter);
    } catch(e) {
        // 失败保留上一次高亮，按退避重试
        var delays = [5000, 15000, 45000];
        if (_activityRetry >= delays.length) return;
        var d = delays[_activityRetry++];
        if (_activityTimer) clearTimeout(_activityTimer);
        _activityTimer = setTimeout(function(){ refreshActivity(groupFilter); }, d);
    }
}
function refreshGlobalActivity(){ return refreshActivity('global'); }
function refreshSessionActivity(){ return refreshActivity('session'); }
function pulseSessionGroup(){
    var g = document.querySelector('.footer-bar .fb-group[data-scope="session"]');
    if (!g) return;
    g.classList.remove('pulse');
    void g.offsetWidth;
    g.classList.add('pulse');
    setTimeout(function(){ g.classList.remove('pulse'); }, 600);
}
