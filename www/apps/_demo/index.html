<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notes Demo</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --text:#1f2933; --muted:#6b7280; --border:#e5e7eb; --primary:#2563eb; --primary-hover:#1d4ed8; --danger:#b91c1c; --ok:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px 60px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .row > input[type="text"] { flex:1; min-width:180px; }
  input[type="text"], input[type="file"], textarea, select { width:100%; padding:10px 12px; font-size:14px; font-family:inherit; color:inherit; background:#fff; border:1px solid var(--border); border-radius:8px; outline:none; transition:border-color .15s; }
  input[type="text"]:focus, textarea:focus, select:focus { border-color:var(--primary); }
  textarea { min-height:70px; resize:vertical; }
  select { width:auto; min-width:150px; }
  button { padding:10px 14px; font-size:13px; font-family:inherit; font-weight:500; color:#fff; background:var(--primary); border:1px solid var(--primary); border-radius:8px; cursor:pointer; transition:background .15s; }
  button:hover { background:var(--primary-hover); border-color:var(--primary-hover); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:#fff; color:var(--primary); border-color:var(--border); }
  button.ghost:hover { background:var(--bg); border-color:var(--primary); }
  button.danger { background:#fff; color:var(--danger); border-color:#fca5a5; }
  button.danger:hover { background:#fef2f2; border-color:var(--danger); }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  li:last-child { border-bottom:none; }
  li .text { flex:1; word-break:break-word; }
  li button { padding:4px 10px; font-size:12px; }
  .msg { min-height:18px; font-size:13px; margin-top:10px; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--ok); }
  .empty { color:var(--muted); font-size:13px; padding:16px 0; text-align:center; }
  .progress { height:4px; background:var(--border); border-radius:2px; overflow:hidden; margin-top:8px; display:none; }
  .progress.show { display:block; }
  .progress .bar { height:100%; width:0; background:var(--primary); transition:width .2s; }
  .out { margin-top:10px; font-size:13px; white-space:pre-wrap; word-break:break-word; min-height:24px; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px; display:none; }
  .out.show { display:block; }
  .file-item { display:flex; gap:10px; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .file-item:last-child { border-bottom:none; }
  .file-item a { color:var(--primary); text-decoration:none; word-break:break-all; }
  .file-item a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Notes Demo</h1>
  <div class="sub">notes.py（CRUD + LLM + SSE + WS + 上传 + call_ping）+ collab.py（四种 system.call）+ ping.py（极简被调用方）</div>

  <div class="card">
    <h2>notes · 列表 / 新增 / 删除</h2>
    <div class="row">
      <input id="input" type="text" placeholder="写点什么…" autocomplete="off" />
      <button id="btnAdd">添加</button>
    </div>
    <div class="msg" id="msg"></div>
    <ul id="list" style="margin-top:10px"></ul>
    <div class="empty" id="empty" style="display:none">暂无内容</div>
  </div>

  <div class="card">
    <h2>notes · LLM（chat / chat_json）</h2>
    <textarea id="llmInput" placeholder="问点什么…"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="btnChat">chat（str）</button>
      <button id="btnJson" class="ghost">chat_json（dict）</button>
    </div>
    <div class="msg" id="llmMsg"></div>
    <div class="out" id="llmOut"></div>
  </div>

  <div class="card">
    <h2>notes · SSE 流式</h2>
    <div class="row">
      <input id="sseInput" type="text" placeholder="默认：用三句话介绍一下 Python" />
      <button id="btnSSE">开始流式</button>
    </div>
    <div class="out" id="sseOut"></div>
  </div>

  <div class="card">
    <h2>notes · WS 推流</h2>
    <div class="row">
      <input id="wsInput" type="text" placeholder="推流内容…" />
      <button id="btnWS">推送</button>
    </div>
    <div class="msg" id="wsMsg"></div>
    <div class="out" id="wsOut"></div>
  </div>

  <div class="card">
    <h2>notes · 文件上传</h2>
    <input id="fileInput" type="file" />
    <div class="progress" id="uploadProgress"><div class="bar" id="uploadBar"></div></div>
    <div class="msg" id="uploadMsg"></div>
    <div class="file-list" id="fileList" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>notes → ping（跨插件 system.call）</h2>
    <div class="row" style="margin-bottom:8px">
      <select id="pingAction">
        <option value="ping">ping（返回 pong）</option>
        <option value="echo">echo（回显 message）</option>
        <option value="info">info（返回插件信息）</option>
      </select>
      <input id="pingInput" type="text" placeholder="echo 时的 message" />
      <button id="btnCallPing">调 ping</button>
    </div>
    <div class="msg" id="pingMsg"></div>
    <div class="out" id="pingOut"></div>
  </div>

  <div class="card">
    <h2>collab · system.call 四种演示</h2>
    <div class="row" style="margin-bottom:8px">
      <button id="btnCollabPing" class="ghost">collab.ping</button>
      <button id="btnCallNotes">collab.call_notes</button>
      <button id="btnChainCreate">collab.chain_create</button>
    </div>
    <div class="row" style="margin-bottom:8px">
      <input id="chainInput" type="text" placeholder="chain_create 的文本" />
    </div>
    <div class="row" style="margin-bottom:8px">
      <input id="contractPlugin" type="text" placeholder="builtins/tools/file_utils_api" />
      <button id="btnContract" class="ghost">get_contract</button>
      <button id="btnBroadcast" class="ghost">broadcast</button>
    </div>
    <div class="msg" id="collabMsg"></div>
    <div class="out" id="collabOut"></div>
  </div>
</div>

<script>
const project = window.location.pathname.split("/")[2];
const API = `/api/applications/${project}`;
const PLUGIN = "notes";
const COLLAB_PLUGIN = "collab";
const CHANNEL = `${project}_${PLUGIN}`;
const COLLAB_CHANNEL = `${project}_${COLLAB_PLUGIN}`;

const $ = (id) => document.getElementById(id);
function setMsg(elId, text, kind) {
  const el = $(elId);
  el.textContent = text || "";
  el.className = "msg" + (kind ? " " + kind : "");
}
function showOut(elId, text) {
  const el = $(elId);
  el.textContent = text || "";
  el.classList.add("show");
}

async function request(plugin, action, payload) {
  const resp = await fetch(`${API}/${plugin}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ action }, payload || {})),
  });
  const text = await resp.text();
  if (!text) return { ok: false, error: "空响应" };
  try { return JSON.parse(text); }
  catch (e) { return { ok: false, error: "返回格式异常: " + text.slice(0, 80) }; }
}
const notes = (action, payload) => request(PLUGIN, action, payload);
const collab = (action, payload) => request(COLLAB_PLUGIN, action, payload);

async function load() {
  const r = await notes("list");
  const box = $("list");
  const empty = $("empty");
  box.textContent = "";
  const items = (r && r.data) || [];
  if (!items.length) { empty.style.display = "block"; return; }
  empty.style.display = "none";
  for (const item of items) {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.className = "text";
    span.textContent = item.text;
    const btn = document.createElement("button");
    btn.className = "danger";
    btn.textContent = "删除";
    btn.onclick = async () => {
      const rr = await notes("delete", { id: item.id });
      if (rr.ok) { setMsg("msg", "已删除", "ok"); await load(); }
      else setMsg("msg", rr.error || "删除失败", "err");
    };
    li.appendChild(span);
    li.appendChild(btn);
    box.appendChild(li);
  }
}

async function add() {
  const input = $("input");
  const text = input.value.trim();
  if (!text) { setMsg("msg", "请输入内容", "err"); return; }
  const btn = $("btnAdd");
  btn.disabled = true;
  try {
    const r = await notes("create", { text });
    if (r.ok) { input.value = ""; setMsg("msg", "已添加", "ok"); await load(); }
    else setMsg("msg", r.error || "添加失败", "err");
  } finally { btn.disabled = false; }
}

async function llmChat() {
  const text = $("llmInput").value.trim();
  if (!text) { setMsg("llmMsg", "请输入内容", "err"); return; }
  showOut("llmOut", "思考中…");
  const btn = $("btnChat");
  btn.disabled = true;
  try {
    const r = await notes("llm_chat", { text });
    if (r.ok) { showOut("llmOut", r.data.reply || "(空)"); setMsg("llmMsg", "完成", "ok"); }
    else { showOut("llmOut", ""); setMsg("llmMsg", r.error || "失败", "err"); }
  } finally { btn.disabled = false; }
}

async function llmJson() {
  const text = $("llmInput").value.trim();
  if (!text) { setMsg("llmMsg", "请输入内容", "err"); return; }
  showOut("llmOut", "思考中…");
  const btn = $("btnJson");
  btn.disabled = true;
  try {
    const r = await notes("llm_json", { text });
    if (r.ok) { showOut("llmOut", JSON.stringify(r.data, null, 2)); setMsg("llmMsg", "完成", "ok"); }
    else { showOut("llmOut", ""); setMsg("llmMsg", r.error || "失败", "err"); }
  } finally { btn.disabled = false; }
}

async function runSSE() {
  const text = $("sseInput").value.trim();
  showOut("sseOut", "");
  const btn = $("btnSSE");
  btn.disabled = true;
  try {
    const resp = await fetch(`${API}/${PLUGIN}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "stream_demo", text }),
    });
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    const out = $("sseOut");
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const evt = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        const line = evt.split("\n").find(l => l.startsWith("data: "));
        if (!line) continue;
        let msg;
        try { msg = JSON.parse(line.slice(6)); } catch { continue; }
        if (msg.type === "delta") out.textContent += (msg.text || "");
        else if (msg.type === "done") out.textContent += "\n[完成]";
        else if (msg.type === "error") out.textContent += "\n[错误] " + (msg.error || "");
      }
    }
  } catch (e) {
    showOut("sseOut", "[失败] " + e.message);
  } finally { btn.disabled = false; }
}

async function pushWS() {
  const text = $("wsInput").value.trim();
  if (!text) { setMsg("wsMsg", "请输入内容", "err"); return; }
  const btn = $("btnWS");
  btn.disabled = true;
  setMsg("wsMsg", "推送中…");
  try {
    const r = await notes("push_demo", { text });
    if (r.ok) setMsg("wsMsg", "推送完成", "ok");
    else setMsg("wsMsg", r.error || "推送失败", "err");
  } finally { btn.disabled = false; }
}

async function uploadFile(file) {
  const cfg = await fetch("/api/upload_config").then(r => r.json());
  const form = new FormData();
  form.append("file", file);
  const progress = $("uploadProgress");
  const bar = $("uploadBar");
  progress.classList.add("show");
  bar.style.width = "0%";
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", cfg.url);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) bar.style.width = Math.round((e.loaded / e.total) * 100) + "%";
    };
    xhr.upload.onloadend = () => { bar.style.width = "100%"; };
    xhr.onload = () => {
      progress.classList.remove("show");
      if (xhr.status >= 200 && xhr.status < 300) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (e) { reject(new Error("返回格式异常")); }
      } else reject(new Error("HTTP " + xhr.status));
    };
    xhr.onerror = () => { progress.classList.remove("show"); reject(new Error("网络错误")); };
    xhr.send(form);
  });
}

async function loadFiles() {
  const r = await notes("upload_list");
  const box = $("fileList");
  box.textContent = "";
  const items = (r && r.data) || [];
  if (!items.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "暂无上传文件";
    box.appendChild(e);
    return;
  }
  for (const f of items) {
    const row = document.createElement("div");
    row.className = "file-item";
    const a = document.createElement("a");
    a.href = f.url || "#";
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = f.file_name || f.file_path;
    const size = document.createElement("span");
    size.textContent = f.file_size ? Math.round(f.file_size / 1024) + " KB" : "";
    size.style.color = "var(--muted)";
    row.appendChild(a);
    row.appendChild(size);
    box.appendChild(row);
  }
}

async function callPing() {
  const pingAction = $("pingAction").value;
  const msg = $("pingInput").value.trim() || "hello";
  const btn = $("btnCallPing");
  btn.disabled = true;
  setMsg("pingMsg", "调用中…");
  try {
    const r = await notes("call_ping", { ping_action: pingAction, message: msg });
    if (r.ok) {
      showOut("pingOut", JSON.stringify(r.data, null, 2));
      setMsg("pingMsg", "完成", "ok");
    } else {
      setMsg("pingMsg", r.error || "失败", "err");
    }
  } finally { btn.disabled = false; }
}

async function collabPing() {
  setMsg("collabMsg", "collab.ping…");
  const r = await collab("ping");
  if (r.ok) showOut("collabOut", JSON.stringify(r.data, null, 2));
  else setMsg("collabMsg", r.error || "失败", "err");
}
async function collabCallNotes() {
  setMsg("collabMsg", "collab.call_notes…");
  const r = await collab("call_notes");
  if (r.ok) showOut("collabOut", JSON.stringify(r.data, null, 2));
  else setMsg("collabMsg", r.error || "失败", "err");
}
async function collabChainCreate() {
  const text = $("chainInput").value.trim();
  if (!text) { setMsg("collabMsg", "请输入内容", "err"); return; }
  setMsg("collabMsg", "collab.chain_create…");
  const r = await collab("chain_create", { text });
  if (r.ok) {
    showOut("collabOut", JSON.stringify(r.data, null, 2));
    setMsg("collabMsg", "完成，已推 WS", "ok");
    await load();
  } else setMsg("collabMsg", r.error || "失败", "err");
}
async function collabContract() {
  const plugin = $("contractPlugin").value.trim() || "builtins/tools/file_utils_api";
  setMsg("collabMsg", "get_contract…");
  const r = await collab("get_contract", { plugin });
  if (r.ok) showOut("collabOut", JSON.stringify(r.data, null, 2));
  else setMsg("collabMsg", r.error || "失败", "err");
}
async function collabBroadcast() {
  const text = $("chainInput").value.trim() || "broadcast from collab";
  setMsg("collabMsg", "broadcast…");
  const r = await collab("broadcast", { text });
  if (r.ok) showOut("collabOut", JSON.stringify(r.data, null, 2));
  else setMsg("collabMsg", r.error || "失败", "err");
}

let ws = null;
function connectWS() {
  fetch("/api/ws_config").then(r => r.json()).then(cfg => {
    ws = new WebSocket(`${cfg.url}?channel=${encodeURIComponent(CHANNEL)}`);
    const out = $("wsOut");
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === "connected" || msg.type === "pong") return;
      if (msg.type === "delta") {
        out.classList.add("show");
        out.textContent += (msg.text || "");
      } else if (msg.type === "done") {
        out.textContent += "\n[完成]";
      } else if (msg.type === "error") {
        out.textContent += "\n[错误] " + (msg.error || "");
      } else if (msg.type === "created" || msg.type === "deleted") {
        load();
      }
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
  });
}

function init() {
  $("btnAdd").onclick = add;
  $("input").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
  $("btnChat").onclick = llmChat;
  $("btnJson").onclick = llmJson;
  $("btnSSE").onclick = runSSE;
  $("btnWS").onclick = pushWS;
  $("btnCallPing").onclick = callPing;
  $("btnCollabPing").onclick = collabPing;
  $("btnCallNotes").onclick = collabCallNotes;
  $("btnChainCreate").onclick = collabChainCreate;
  $("btnContract").onclick = collabContract;
  $("btnBroadcast").onclick = collabBroadcast;
  $("fileInput").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setMsg("uploadMsg", "上传中…");
    try {
      const r = await uploadFile(f);
      if (r && (r.success || r.ok)) {
        await request(PLUGIN, "upload_add", { file: r });
        setMsg("uploadMsg", "上传成功: " + (r.file_name || f.name), "ok");
        await loadFiles();
      } else {
        setMsg("uploadMsg", (r && r.error) || "上传失败", "err");
      }
    } catch (err) {
      setMsg("uploadMsg", "上传失败: " + err.message, "err");
    }
    e.target.value = "";
  });
  load();
  loadFiles();
  connectWS();
}

init();
</script>
</body>
</html>
